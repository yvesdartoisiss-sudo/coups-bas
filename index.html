<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Coups Bas</title>

<style>
/* Table de jeu en feutrine : plateau en anneau au centre, panneaux d'action dessous (téléphone) ou à droite (grand écran). */
:root{
  --felt:#0f3329; --felt-2:#0a261e; --felt-3:#164537;
  --brass:#e7bd52; --brass-2:#b8902f;
  --cream:#f7eedb; --cream-2:#eadcbf; --ink:#221d17; --ink-2:#5b5244;
  --red:#e0523f; --blue:#5b9be0; --ok:#4fbf7a; --muted:#9dbfb3;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--felt-3),var(--felt) 55%,var(--felt-2));background-color:var(--felt);color:var(--cream);font:16px/1.4 var(--body);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:max(10px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}
.btn{border:0;border-radius:999px;padding:.7em 1.2em;background:var(--brass);color:var(--ink);font-weight:600;box-shadow:0 3px 0 var(--brass-2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--cream);box-shadow:0 3px 0 var(--cream-2)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 #9c3326}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px rgba(247,238,219,.35)}
.btn.sm{padding:.45em .9em;font-size:.9rem}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field{display:grid;gap:6px}
.field input,.field select{background:rgba(0,0,0,.25);border:2px solid rgba(247,238,219,.25);border-radius:10px;color:var(--cream);padding:.6em .8em}
.field input:focus,.field select:focus{border-color:var(--brass);outline:none}

/* ---------- Accueil ---------- */
.hero{text-align:center;padding:18px 0 8px}
.logo{font-family:var(--display);font-size:clamp(3rem,13vw,6.2rem);line-height:.9;color:var(--brass);text-shadow:0 4px 0 #6d5418,0 10px 24px rgba(0,0,0,.4);transform:rotate(-3deg);display:inline-block}
.logo small{display:block;font-size:.28em;color:var(--cream);text-shadow:none;transform:rotate(2deg);margin-top:8px}
.tag{max-width:560px;margin:14px auto 0;color:var(--cream-2)}
.mix{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.mix span{font-size:.8rem;padding:.25em .7em;border-radius:999px;background:rgba(0,0,0,.25);color:var(--muted)}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:22px}
.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.card h2{font-size:1.6rem;color:var(--felt)}
.card .field input,.card .field select{background:#fff;color:var(--ink);border-color:var(--cream-2)}
.card .label{color:var(--ink-2)}
.card .stack{display:grid;gap:12px;margin-top:12px}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.avatars button{font-size:1.5rem;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--cream-2)}
.avatars button[aria-pressed="true"]{border-color:var(--felt);background:#fff;transform:scale(1.08)}
.seg{display:flex;background:var(--cream-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:.55em .4em;background:transparent;color:var(--ink-2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--cream)}
.seg button small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.rules{margin-top:22px;background:rgba(0,0,0,.2);border-radius:18px;padding:16px 18px}
.rules summary{font-family:var(--display);font-size:1.3rem;cursor:pointer;color:var(--brass)}
.rules h3{font-size:1.1rem;color:var(--brass);margin-top:14px}
.rules p,.rules li{max-width:68ch;color:var(--cream-2)}
.rules ul{padding-left:1.2em;margin:.4em 0}

/* ---------- Salon ---------- */
.lobby{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:14px}
.code{font-family:var(--display);font-size:clamp(3rem,16vw,5rem);letter-spacing:.12em;color:var(--brass);line-height:1}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin-top:10px}
.qr img,.qr canvas{display:block;width:150px;height:150px}
.plist{display:grid;gap:8px;margin-top:10px}
.pl{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px}
.pl .av{font-size:1.6rem}
.pl .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:#777}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.linkbox code{background:rgba(0,0,0,.3);padding:.35em .6em;border-radius:8px;font-size:.8rem;word-break:break-all;min-width:0;flex:1}

/* ---------- Jeu ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top .brand{font-family:var(--display);color:var(--brass);font-size:1.5rem;transform:rotate(-2deg)}
.pill{background:rgba(0,0,0,.28);border-radius:999px;padding:.3em .8em;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--brass)}
.game{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:960px){.game{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;aspect-ratio:1;max-width:100%;width:100%;max-height:80vh;margin:0 auto;position:relative}
.cell{background:var(--cream);color:var(--ink);border-radius:8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 2px;overflow:hidden;min-width:0;min-height:0}
.cell.sp{background:#2a5b4c;color:var(--cream)}
.cell .band{position:absolute;inset:0 0 auto 0;height:5px}
.cell .ce{font-size:clamp(.9rem,3.6vw,1.6rem);line-height:1.1;margin-top:4px}
.cell .cn{font-size:clamp(.42rem,1.6vw,.68rem);line-height:1.05;text-align:center;font-weight:600;max-width:100%;overflow:hidden}
.cell .cp{font-size:clamp(.4rem,1.5vw,.62rem);color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell.sp .cp{color:var(--muted)}
.cell.owned{box-shadow:inset 0 0 0 3px var(--oc)}
.cell .lvl{position:absolute;top:6px;right:3px;font-size:.6rem}
.cell .toks{position:absolute;bottom:1px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0;line-height:1}
.tok{font-size:clamp(.8rem,3vw,1.25rem);filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.tok.cur{animation:hop .9s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-4px)}}
.cell.here{outline:3px solid var(--brass);outline-offset:-1px}
.center{grid-column:2/6;grid-row:2/6;background:rgba(0,0,0,.22);border-radius:14px;padding:clamp(6px,2vw,14px);display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;overflow:hidden}
.center .who{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:clamp(1rem,3.8vw,1.5rem)}
.center .who .av{font-size:1.6em}
.center .clog{flex:1;overflow:auto;font-size:clamp(.66rem,2.4vw,.86rem);display:flex;flex-direction:column;gap:3px;color:var(--cream-2);min-height:0}
.center .clog div:first-child{color:var(--cream);font-weight:600}
.dice{display:inline-grid;place-items:center;width:1.9em;height:1.9em;background:var(--cream);color:var(--ink);border-radius:.35em;font-family:var(--display);font-size:clamp(1rem,4vw,1.5rem);box-shadow:0 3px 0 var(--cream-2)}
.dice.roll{animation:roll .6s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.4)}70%{transform:rotate(15deg) scale(1.15)}100%{transform:none}}
.side{display:grid;gap:14px;min-width:0}
.panel{background:var(--cream);color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25);min-width:0}
.panel.mine{box-shadow:0 0 0 4px var(--brass),0 6px 0 rgba(0,0,0,.25)}
.panel h2{font-size:1.35rem;color:var(--felt)}
.panel p{margin:.4em 0}
.panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.panel .btn.alt{background:var(--cream-2);box-shadow:0 3px 0 #cdbb94}
.timer{height:6px;background:var(--cream-2);border-radius:6px;overflow:hidden;margin-top:10px}
.timer i{display:block;height:100%;background:var(--felt);transition:width 1s linear}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:2px solid var(--cream-2);background:#fff;color:var(--ink);border-radius:12px;padding:.4em .7em;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--felt);background:var(--felt);color:var(--cream)}
.chip:disabled{opacity:.4}
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:14px;padding:4px}
.tab{flex:1;border:0;border-radius:10px;padding:.55em .3em;background:transparent;color:var(--cream-2);font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--cream);color:var(--ink)}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.tcard{width:96px;min-height:120px;border-radius:12px;background:linear-gradient(160deg,#fff,var(--cream));border:2px solid var(--cream-2);color:var(--ink);padding:8px;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tcard .te{font-size:1.6rem}
.tcard b{font-size:.82rem;line-height:1.1}
.tcard span{font-size:.68rem;color:var(--ink-2);line-height:1.15}
.tcard.trap{border-color:var(--red)}
.tcard.trap .te{color:var(--red)}
.tcard.react{border-color:var(--blue)}
.tcard[aria-pressed="true"]{outline:3px solid var(--felt);transform:translateY(-4px)}
.tcard:disabled{opacity:.55}
.clue{width:auto;min-height:0;flex-direction:row;align-items:center;padding:6px 10px;border-color:var(--brass)}
.clue .te{font-size:1.2rem}
.note{width:100%;border-collapse:collapse;font-size:.88rem}
.note td{padding:4px 6px;border-bottom:1px solid var(--cream-2)}
.note td:last-child{text-align:right;white-space:nowrap}
.note tr.h td{font-family:var(--display);color:var(--felt);padding-top:10px;border:0;font-size:1rem}
.note .mk{border:0;background:var(--cream-2);border-radius:8px;min-width:2.4em;padding:.2em .4em;font-weight:600}
.note .mk.x{background:var(--red);color:#fff}
.note .mk.q{background:var(--brass)}
.note .mk.ok{background:var(--felt);color:var(--cream)}
.note tr.done td:first-child{text-decoration:line-through;color:var(--ink-2)}
.ptable{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--cream-2)}
.prow.cur{background:#fff;box-shadow:inset 0 0 0 2px var(--felt)}
.prow .av{font-size:1.5rem}
.prow .meta{font-size:.75rem;color:var(--ink-2)}
.prow .g{font-family:var(--display);font-size:1.1rem;color:var(--felt);font-variant-numeric:tabular-nums}
.logl{display:grid;gap:4px;font-size:.88rem;max-height:340px;overflow:auto}
.logl div{border-bottom:1px solid var(--cream-2);padding-bottom:3px}
.battle{display:flex;gap:16px;align-items:center;justify-content:center;margin:10px 0}
.pc{width:58px;height:82px;border-radius:9px;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:var(--red);animation:flip .5s ease-out both}
.pc.b{color:var(--ink)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.vs{font-family:var(--display);color:var(--ink-2)}
.toasts{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px;justify-items:center;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);border:2px solid var(--brass);border-radius:14px;padding:10px 14px;max-width:min(520px,100%);box-shadow:0 8px 20px rgba(0,0,0,.4);animation:up .3s ease-out;pointer-events:auto}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40;padding:16px}
.modal .panel{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:45}
.banner div{font-family:var(--display);font-size:clamp(1.8rem,8vw,4.2rem);max-width:100%;overflow-wrap:anywhere;color:var(--brass);text-shadow:0 4px 0 #6d5418,0 0 30px rgba(0,0,0,.6);animation:pop 1.6s ease-out forwards;text-align:center;padding:0 12px}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.1) rotate(-3deg);opacity:1}80%{opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:0}}
.word{font-family:var(--display);font-size:2rem;color:var(--red);text-align:center;margin:6px 0}
.cluelist{display:grid;gap:6px;margin-top:8px}
.cluelist button{display:flex;gap:8px;align-items:center;text-align:left;border:2px solid var(--cream-2);background:#fff;border-radius:12px;padding:6px 10px;color:var(--ink)}
.cluelist button[aria-pressed="true"]{border-color:var(--red);background:#ffe9e5}
.cluelist b{font-family:var(--display);font-weight:400;color:var(--felt)}
.rank{display:grid;gap:8px;margin-top:10px}
.rank div{display:flex;gap:10px;align-items:center;background:var(--cream-2);border-radius:12px;padding:8px 12px}
.rank .n{font-family:var(--display);font-size:1.4rem;color:var(--felt);width:1.6em}
.sol{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sol div{background:var(--felt);color:var(--cream);border-radius:12px;padding:10px 14px;text-align:center}
.sol div span{display:block;font-size:2rem}
.err{background:var(--red);color:#fff;border-radius:10px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let G=null;
function newGame(code,mode,rounds){return {code,id:uid(),mode,rounds,status:'lobby',players:[],dir:1,cur:0,turnCount:0,maxTurns:0,owners:{},pot:0,log:[],phase:null,turn:{},soiree:null,winner:null,seq:0}}

function log(t){G.log.unshift(t);G.log.length=Math.min(G.log.length,60)}

function drawTrap(){const pool=Object.entries(TRAPS).filter(([k,v])=>!(easy()&&v.hard));let tot=pool.reduce((s,[,v])=>s+v.w,0),r=Math.random()*tot;for(const [k,v] of pool){r-=v.w;if(r<0)return k}return 'skip'}
function giveTraps(p,n){let got=0;for(let i=0;i<n&&p.traps.length<MAX_HAND;i++){p.traps.push(drawTrap());got++}return got}
function addPlayer(id,name,av){

function startGame(){

  G.players.forEach((p,i)=>{p.pos=0;p.gold=START_GOLD[G.mode];p.cards=[];p.traps=[];p.seen={};p.inbox=[];p.skip=0;p.cave=false;p.noAcc=0;p.bailiff=false;p.color=COLORS[i%COLORS.length];giveTraps(p,easy()?2:3)});

function phase(k,data={},secs){

function startTurn(){

function advance(){

}
function fortune(p){let f=p.gold;for(const [c,o] of Object.entries(G.owners))if(o.pid===p.id)f+=BOARD[c].price*(1+o.lvl*.5);return Math.round(f)}
function endGame(winnerId){

function land(p){
  const c=BOARD[p.pos];

    case 'room':{
      const o=G.owners[p.pos];
      if(!o)return phase('buy',{actor:p.id,cell:p.pos});

      const owner=P(o.pid);let rent=c.rent*(1+o.lvl);

    case 'chance':return drawChance(p);

      if(G.players.length<2)return phase('end',{actor:p.id,msg:'Personne à défier.'});
      return phase('duel_pick',{actor:p.id,ctx:'case'});
    case 'pot':{const x=G.pot;G.pot=0;gain(p,x);log(`🍯 ${p.av} ${p.name} rafle le pot commun : +${x}.`);return phase('end',{actor:p.id,msg:x?`Tu rafles le pot commun : +${x} !`:'Le pot commun est vide… dommage.'})}
    case 'impot':{const x=lose(p,100);G.pot+=x;log(`🧾 ${p.av} ${p.name} paie ${x} d'impôt au pot commun.`);return phase('end',{actor:p.id,msg:`Tonton prélève ${x} pour le pot commun.`})}

function roomAfter(p,msg){

function drawChance(p){
  const ch=pick(CHANCES);let msg=ch.t;
  log(`❓ ${p.av} ${p.name} : ${ch.t}`);
  const others=G.players.filter(x=>x.id!==p.id);
  switch(ch.id){
    case 'pocket':gain(p,100);break;
    case 'gift':gain(p,150);break;
    case 'vase':G.pot+=lose(p,80);break;
    case 'bday':others.forEach(o=>gain(p,lose(o,30)));break;
    case 'cave':p.pos=10;p.cave=true;break;
    case 'depart':p.pos=0;gain(p,PASS_GOLD);giveTraps(p,1);break;
    case 'cards':giveTraps(p,2);break;
    case 'tip':{const o=pick(others.filter(x=>x.cards.length));if(o){const cd=pick(o.cards);p.seen[cd]=o.name;tell(p,`📨 ${o.av} ${o.name} a la carte ${card(cd).e} ${card(cd).n}.`);msg+=` → ${o.name} te montre ${card(cd).e} ${card(cd).n}.`}break}
    case 'robin':{const s=[...G.players].sort((a,b)=>b.gold-a.gold);if(s.length>1){const x=lose(s[0],100);gain(s[s.length-1],x);log(`🏹 ${s[0].name} donne ${x} à ${s[s.length-1].name}.`)}break}
    case 'music':{const pos=G.players.map(x=>x.pos);G.players.forEach((x,i)=>x.pos=pos[(i+1)%pos.length]);break}
    case 'party':return startSoiree(p,ch);
    case 'cop':return phase('suggest',{actor:p.id,anyRoom:true,chance:ch});
    case 'works':{const nb=Object.values(G.owners).filter(o=>o.pid===p.id).length;G.pot+=lose(p,30*nb);msg+=` (${nb} pièce${nb>1?'s':''})`;break}
    case 'oops':{const poor=[...others].sort((a,b)=>a.gold-b.gold)[0];if(poor&&p.cards.length){const cd=pick(p.cards);poor.seen[cd]=p.name;tell(poor,`🙊 ${p.av} ${p.name} te montre ${card(cd).e} ${card(cd).n}.`);msg+=` ${poor.name} a vu ${card(cd).e} ${card(cd).n}.`}break}
  }
  phase('end',{actor:p.id,msg,chance:ch});
}
/* --- Coups bas (cartes à la Uno) --- */
function playTrap(p,idx,targetId){
  const k=p.traps[idx];const tr=TRAPS[k];if(!tr||tr.r)return 'Cette carte se joue en réflexe, quand on te vise.';
  if(G.turn.played)return 'Un seul coup bas par tour.';
  let tg=null;
  if(tr.t){tg=P(targetId);if(!tg||tg.id===p.id)return 'Choisis une cible.'}
  p.traps.splice(idx,1);G.turn.played=true;
  log(`${tr.e} ${p.av} ${p.name} joue « ${tr.n} »${tg?` sur ${tg.av} ${tg.name}`:''} !`);
  if(tg){
    const re=tg.traps.findIndex(x=>TRAPS[x].r);
    if(re>=0)return phase('react',{actor:tg.id,from:p.id,to:tg.id,card:k});
  }
  applyTrap(k,p,tg);
  phase('start',{actor:curP().id,after:true});
}
function applyTrap(k,from,to){
  switch(k){
    case 'skip':to.skip++;break;
    case 'reverse':G.dir*=-1;break;
    case 'banana':{to.pos=(to.pos-3+20)%20;break}
    case 'pickpocket':gain(from,lose(to,80));break;
    case 'swap':[from.pos,to.pos]=[to.pos,from.pos];break;
    case 'magnet':to.pos=from.pos;break;
    case 'dice':G.turn.fixed=true;break;
    case 'spy':{if(to.cards.length){const cd=pick(to.cards);from.seen[cd]=to.name;tell(from,`🕵️ ${to.av} ${to.name} a la carte ${card(cd).e} ${card(cd).n}.`)}else tell(from,`🕵️ ${to.name} n'a aucune carte indice.`);break}
    case 'bailiff':from.bailiff=true;break;
    case 'storm':{for(let i=0;i<2&&to.traps.length;i++)to.traps.splice(rnd(to.traps.length),1);break}
  }
}
function react(p,choice){
  const ph=G.phase;const from=P(ph.from),to=P(ph.to);
  const idx=p.traps.indexOf(choice);
  if(choice==='shield'&&idx>=0){p.traps.splice(idx,1);log(`🛡️ ${to.av} ${to.name} se protège avec un Bouclier !`)}
  else if(choice==='mirror'&&idx>=0){p.traps.splice(idx,1);log(`🪞 ${to.av} ${to.name} renvoie le coup à ${from.name} !`);
    if(ph.card==='swap'||ph.card==='magnet'){applyTrap(ph.card,to,from)}else applyTrap(ph.card,to,from)}
  else{applyTrap(ph.card,from,to)}
  phase('start',{actor:curP().id,after:true});
}
/* --- Cluedo : soupçons --- */
function suggest(p,s,o,room){
  G.turn.suggested=true;
  const trio=[s,o,room];
  log(`🔎 ${p.av} ${p.name} soupçonne ${card(s).e} ${card(s).n} avec ${card(o).e} ${card(o).n} dans ${card(room).e} ${card(room).n}.`);
  const n=G.players.length;const start=G.players.indexOf(p);
  for(let i=1;i<n;i++){
    const q=G.players[(start+i*G.dir+n*n)%n];
    const has=q.cards.filter(c=>trio.includes(c));
    if(has.length){
      if(has.length===1)return showCard(q,p,has[0]);
      return phase('show',{actor:q.id,to:p.id,options:has,trio});
    }
  }
  log('😱 Personne ne peut répondre au soupçon !');
  tell(p,'😱 Personne n’a pu te montrer de carte : ces cartes sont peut-être dans le dossier secret… ou dans ta main.');
  phase('end',{actor:p.id,msg:'Personne ne peut répondre ! Ces cartes sont peut-être la solution (sauf celles de ta main).'});
}
function showCard(q,p,c){

  tell(q,`Tu as montré ${card(c).e} ${card(c).n} à ${p.name}.`);
  log(`🃏 ${q.av} ${q.name} montre une carte à ${p.av} ${p.name}.`);
  G.curIdx=null;phase('end',{actor:p.id,msg:`${q.name} t'a montré ${card(c).e} ${card(c).n}.`});
}
function accuse(p,s,o,l){
  const ok=G.solution.s===s&&G.solution.o===o&&G.solution.l===l;
  log(`⚖️ ${p.av} ${p.name} accuse ${card(s).n} avec ${card(o).n} dans ${card(l).n}…`);
  if(ok){log(`🏆 C'EST ÇA ! ${p.av} ${p.name} résout l'affaire et gagne !`);return endGame(p.id)}
  if(easy()){const x=lose(p,100);G.pot+=x;p.noAcc=G.turnCount+G.players.length*2;log(`❌ Raté ! ${p.name} perd ${x} et doit attendre 2 tours pour réaccuser.`)}
  else{const x=lose(p,Math.ceil(p.gold/2));G.pot+=x;p.noAcc=1e9;log(`❌ Raté ! ${p.name} perd ${x} (moitié de sa fortune) et ne peut plus accuser.`)}
  phase('end',{actor:p.id,msg:'Mauvaise accusation…'});
}
/* --- Bataille --- */
function battle(a,b,ctx,extra={}){
  const rounds=[];let w=null;
  while(rounds.length<6){const x=rnd(13),y=rnd(13);rounds.push([x,y]);if(x!==y){w=x>y?a:b;break}}
  if(!w)w=pick([a,b]);
  const l=w===a?b:a;const stake=100*rounds.length;
  const res={a:a.id,b:b.id,rounds,w:w.id,ctx,...extra};
  if(ctx==='rent'){
    const owner=b;
    if(w===a){res.txt=`${a.name} gagne le duel : pas de loyer !`}
    else{let amt=extra.amount*2;if(owner.bailiff){amt*=2;owner.bailiff=false}const x=lose(a,amt);gain(owner,x);res.txt=`${a.name} perd le duel et paie ${x} à ${owner.name} !`}
  }else{
    const x=lose(l,stake);gain(w,x);res.txt=`${w.name} gagne${rounds.length>1?' la BATAILLE':''} et vole ${x} à ${l.name} !`;
  }
  if(l.cards.length){const cd=pick(l.cards);w.seen[cd]=l.name;tell(w,`⚔️ Butin : ${l.av} ${l.name} a la carte ${card(cd).e} ${card(cd).n}.`)}
  log(`⚔️ Duel ${a.av} ${a.name} contre ${b.av} ${b.name} — ${res.txt}`);
  phase('duel_res',{actor:G.players[G.cur].id,res});
}
/* --- Soirée masquée (Undercover) --- */
function startSoiree(p,chance){

  const pair=shuffle([...pick(WORDS[G.mode])]);

function soireeVotePhase(){G.soiree.ids.forEach(id=>{if(!G.soiree.clues[id])G.soiree.clues[id]='…'});phase('soiree_vote',{actor:curP().id})}
function soireeResult(){
  const S=G.soiree;const cnt={};Object.values(S.votes).forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const max=Math.max(0,...Object.values(cnt));const top=Object.keys(cnt).filter(k=>cnt[k]===max);
  const caught=max>0&&top.length===1&&top[0]===S.und;const u=P(S.und);
  if(caught){S.ids.filter(id=>id!==S.und).forEach(id=>gain(P(id),60));G.pot+=lose(u,60);S.txt=`Démasqué ! ${u.av} ${u.name} était l'intrus. Tous les autres gagnent 60.`}
  else{gain(u,150);S.txt=`${u.av} ${u.name} était l'intrus et s'en sort : +150 !`}
  log('🎭 '+S.txt);phase('soiree_res',{actor:curP().id});
}

function handleAct(pid,a){
  if(!G)return;

  const ph=G.phase||{};const isCur=G.status==='play'&&curP().id===pid;const isActor=ph.actor===pid;
  const err=m=>{tell(p,'⚠️ '+m)};
  if(G.status==='lobby'){

    if(a.type==='kick'&&a.id!==hostPid){G.players=G.players.filter(x=>x.id!==a.id);for(const [cid,id] of Object.entries(connPid))if(id===a.id){net.send(cid,{t:'err',msg:'L’hôte t’a retiré du salon.'});delete connPid[cid]}}

    case 'play':if(!isCur||ph.k!=='start')break;{const e=playTrap(p,a.idx,a.target);if(e)err(e)}break;

      else{const d=1+rnd(6);G.lastRoll={v:d,by:p.id,i:++G.seq};p.cave=false;if(d>=5){log(`🎲 ${p.av} ${p.name} fait ${d} et s'évade de la Cave !`);move(p,d);land(p)}else{log(`🎲 ${p.av} ${p.name} fait ${d} : reste un tour de plus… et sort au prochain.`);phase('end',{actor:p.id,msg:`Raté (${d}). Tu sortiras au prochain tour.`})}}
      break;
    case 'buy':if(!isActor||ph.k!=='buy')break;{const c=BOARD[ph.cell];if(p.gold<c.price){err('Pas assez de pièces.');break}lose(p,c.price);G.owners[ph.cell]={pid:p.id,lvl:0};log(`🏠 ${p.av} ${p.name} achète ${caseName(c)} pour ${c.price}.`);roomAfter(p,`Tu possèdes maintenant ${caseName(c)} !`)}break;
    case 'pass':if(!isActor||!['buy','own'].includes(ph.k))break;roomAfter(p,'');break;
    case 'renovate':if(!isActor||ph.k!=='own')break;{const c=BOARD[ph.cell],o=G.owners[ph.cell];const cost=c.price/2;if(o.lvl>=2||p.gold<cost){err('Rénovation impossible.');break}lose(p,cost);o.lvl++;log(`🔨 ${p.av} ${p.name} rénove ${caseName(c)} (loyer ×${o.lvl+1}).`);roomAfter(p,`${caseName(c)} rénovée : loyer ×${o.lvl+1} !`)}break;
    case 'rent':if(!isActor||ph.k!=='rent')break;{
      const owner=P(ph.owner);
      if(a.choice==='duel'){return battle(p,owner,'rent',{amount:ph.amount}),sync()}
      let amt=ph.amount;if(owner.bailiff){amt*=2;owner.bailiff=false}
      const x=lose(p,amt);gain(owner,x);log(`💸 ${p.av} ${p.name} paie ${x} de loyer à ${owner.av} ${owner.name}.`);roomAfter(p,`Tu paies ${x} à ${owner.name}.`)}break;
    case 'suggest':if(!isActor||!['room_after','suggest'].includes(ph.k))break;{
      if(ph.k==='room_after')return phase('suggest',{actor:p.id,anyRoom:false}),sync();
      const room=ph.anyRoom?a.l:BOARD[p.pos].r;
      if(!card(a.s).n||!card(a.o).n||!ROOMS[room]){err('Choisis un suspect, un objet'+(ph.anyRoom?' et un lieu':'')+'.');break}
      if(ph.anyRoom)G.turn.suggested=true;
      suggest(p,a.s,a.o,room)}break;
    case 'show':if(!isActor||ph.k!=='show'||!ph.options.includes(a.card))break;showCard(p,P(ph.to),a.card);break;
    case 'react':if(!isActor||ph.k!=='react')break;react(p,a.choice);break;
    case 'duel':if(!isActor||ph.k!=='duel_pick')break;{const t=P(a.target);if(!t||t.id===p.id){err('Choisis un adversaire.');break}battle(p,t,'case')}break;
    case 'shop':if(!isActor||ph.k!=='shop')break;{const k=ph.offer[a.i];if(!k)break;if(p.gold<SHOP_PRICE||p.traps.length>=MAX_HAND){err('Impossible : pas assez de pièces ou main pleine (5 cartes).');break}lose(p,SHOP_PRICE);G.pot+=SHOP_PRICE;p.traps.push(k);log(`🛒 ${p.av} ${p.name} achète une carte coup bas.`);phase('end',{actor:p.id,msg:`Tu achètes « ${TRAPS[k].n} ».`})}break;
    case 'passage':if(!isActor||ph.k!=='passage')break;{const ci=roomCase(a.r);if(ci<0)break;p.pos=ci;log(`🚪 ${p.av} ${p.name} prend le passage secret vers ${caseName(BOARD[ci])}.`);land(p)}break;
    case 'accuse':if(!isCur||!['start','end','room_after'].includes(ph.k))break;if(p.noAcc>G.turnCount){err('Tu ne peux pas accuser pour le moment.');break}if(!a.s||!a.o||!a.l)break;accuse(p,a.s,a.o,a.l);break;
    case 'clue':if(ph.k!=='soiree_clue'||!G.soiree.ids.includes(pid))break;{const w=String(a.w||'').trim().split(/\s+/)[0].slice(0,20);if(!w)break;G.soiree.clues[pid]=w;if(G.soiree.ids.every(id=>G.soiree.clues[id]))soireeVotePhase()}break;
    case 'vote':if(ph.k!=='soiree_vote'||!G.soiree.ids.includes(pid)||a.target===pid||!G.soiree.ids.includes(a.target))break;G.soiree.votes[pid]=a.target;if(G.soiree.ids.every(id=>G.soiree.votes[id]||!P(id).online))soireeResult();break;
    case 'endturn':if(!isActor||!['end','room_after','duel_res','soiree_res','shop'].includes(ph.k))break;
      if(ph.k==='duel_res'&&ph.res.ctx==='rent'){roomAfter(p,ph.res.txt);break}
      advance();break;
  }
  sync();
}
function autoAct(){
  const ph=G.phase;if(!ph||G.status!=='play')return;
  const a=ph.actor?P(ph.actor):null;const id=ph.actor;
  switch(ph.k){
    case 'start':doRoll(0);break;
    case 'cave':handleAct(id,{type:'cave',choice:'try'});return;
    case 'buy':case 'own':roomAfter(a,'');break;
    case 'rent':handleAct(id,{type:'rent',choice:'pay'});return;
    case 'room_after':case 'end':case 'soiree_res':advance();break;
    case 'suggest':if(ph.chance)advance();else roomAfter(a,'');break;
    case 'show':showCard(a,P(ph.to),ph.options[0]);break;
    case 'react':applyTrap(ph.card,P(ph.from),P(ph.to));phase('start',{actor:curP().id,after:true});break;
    case 'duel_pick':battle(a,pick(G.players.filter(x=>x.id!==a.id)),'case');break;
    case 'duel_res':if(ph.res.ctx==='rent')roomAfter(a,ph.res.txt);else advance();break;
    case 'shop':phase('end',{actor:id,msg:''});break;
    case 'passage':{const r=pick(Object.keys(ROOMS));a.pos=roomCase(r);land(a);break}
    case 'soiree_clue':soireeVotePhase();break;
    case 'soiree_vote':soireeResult();break;
  }
  sync();
}
/* --- Vue envoyée à chaque joueur (sans les secrets des autres) --- */
function viewFor(pid){
  const me=P(pid);const ph=G.phase?{...G.phase}:null;
  if(ph){delete ph.deadline;ph.left=Math.max(0,(G.phase.deadline||0)-Date.now());
    if(ph.k==='show'&&ph.actor!==pid){delete ph.options}
  }
  let soiree=null;
  if(G.soiree&&ph&&ph.k.startsWith('soiree')){
    const S=G.soiree;const inIt=S.ids.includes(pid);
    soiree={ids:S.ids,inIt,word:inIt?(pid===S.und?S.pair[1]:S.pair[0]):null,done:Object.keys(S.clues),myClue:S.clues[pid]||'',voted:Object.keys(S.votes),myVote:S.votes[pid]||null};
    if(ph.k!=='soiree_clue')soiree.clues=S.clues;
    if(ph.k==='soiree_res'){soiree.votes=S.votes;soiree.und=S.und;soiree.pair=S.pair;soiree.txt=S.txt}
  }
  return {
    gid:G.id,code:G.code,status:G.status,mode:G.mode,rounds:G.rounds,host:hostPid,
    turnCount:G.turnCount,maxTurns:G.maxTurns,pot:G.pot,dir:G.dir,lastRoll:G.lastRoll||null,
    cur:G.status==='play'?curP().id:null,owners:G.owners,log:G.log.slice(0,30),phase:ph,soiree,turn:G.turn,
    players:G.players.map(p=>({id:p.id,name:p.name,av:p.av,color:p.color,pos:p.pos,gold:p.gold,nCards:p.cards.length,nTraps:p.traps.length,skip:p.skip,cave:p.cave,online:p.online,noAcc:p.noAcc>G.turnCount,bailiff:p.bailiff,f:G.status!=='lobby'?fortune(p):0})),
    me:me?{id:me.id,cards:me.cards,traps:me.traps,seen:me.seen,inbox:me.inbox}:null,
    solution:G.status==='end'?G.solution:null,winner:G.winner,ranking:G.ranking||null,
    pool:{s:SUSPECTS.slice(0,G.mode==='facile'?4:6).map(x=>x.id),o:OBJETS.slice(0,G.mode==='facile'?4:6).map(x=>x.id),l:Object.keys(ROOMS)}
  };
}

/* =====================================================================
   RÉSEAU : PeerJS (en ligne) ou BroadcastChannel (?local=1)
   ===================================================================== */
const LOCAL=new URLSearchParams(location.search).has('local');
const PREFIX='coupsbas-v1-';
function makeHostNet(code,h){
  if(LOCAL||typeof Peer==='undefined'){
    if(!LOCAL)return h.onError('nopeer');
    const bc=new BroadcastChannel(PREFIX+code);
    bc.onmessage=e=>{const m=e.data;if(m.to!=='host')return;if(m.kind==='open')h.onConn(m.from);else if(m.kind==='data')h.onData(m.from,m.d);};
    setTimeout(()=>h.onOpen(),0);
    return {send:(id,d)=>bc.postMessage({to:id,kind:'data',d}),close:()=>bc.close()};
  }
  const conns={};let peer;
  const boot=()=>{
    peer=new Peer(PREFIX+code,{debug:0});
    peer.on('open',()=>h.onOpen());
    peer.on('connection',c=>{
      const id=c.connectionId;
      c.on('open',()=>{conns[id]=c;h.onConn(id)});
      c.on('data',d=>h.onData(id,d));
      c.on('close',()=>{delete conns[id];h.onClose(id)});
      c.on('error',()=>{});
    });
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{if(e.type==='unavailable-id'){h.onError('taken');}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){h.onError('network')}});
  };
  boot();
  return {send:(id,d)=>{const c=conns[id];if(c&&c.open)try{c.send(d)}catch(e){}},close:()=>{try{peer.destroy()}catch(e){}},retry:()=>{try{peer.destroy()}catch(e){}setTimeout(boot,1500)}};
}
function makeClientNet(code,h){
  if(LOCAL||typeof Peer==='undefined'){
    if(!LOCAL)return h.onError('nopeer');
    const me='c'+uid();const bc=new BroadcastChannel(PREFIX+code);
    bc.onmessage=e=>{const m=e.data;if(m.to===me&&m.kind==='data')h.onData(m.d)};
    setTimeout(()=>{bc.postMessage({to:'host',from:me,kind:'open'});h.onOpen()},50);
    return {send:d=>bc.postMessage({to:'host',from:me,kind:'data',d}),close:()=>bc.close()};
  }
  let peer,conn,dead=false;
  const connect=()=>{
    if(dead)return;
    conn=peer.connect(PREFIX+code,{reliable:true});
    conn.on('open',()=>h.onOpen());
    conn.on('data',d=>h.onData(d));
    conn.on('close',()=>{h.onClose();setTimeout(connect,2000)});
    conn.on('error',()=>{});
  };
  peer=new Peer({debug:0});
  peer.on('open',connect);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){h.onError('notfound');setTimeout(connect,3000)}else if(e.type==='network'||e.type==='server-error'){h.onError('network')}});
  return {send:d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}},close:()=>{dead=true;try{peer.destroy()}catch(e){}}};
}

/* =====================================================================
   CÔTÉ HÔTE
   ===================================================================== */
let net=null,isHost=false,hostPid=null,myPid=null,V=null;
const connPid={};
function hostStart(code,game){
  isHost=true;G=game;hostPid=myPid;
  net=makeHostNet(code,{
    onOpen(){status('');sync()},
    onConn(id){},
    onData(id,m){
      if(!m||typeof m!=='object')return;
      if(m.t==='hello'){
        let p=P(m.pid);
        if(!p){
          if(G.status!=='lobby'){net.send(id,{t:'err',msg:'La partie a déjà commencé. Demande à l’hôte de relancer une partie.'});return}
          if(G.players.length>=MAX_PLAYERS){net.send(id,{t:'err',msg:'Salon complet (8 joueurs).'});return}
          p=addPlayer(String(m.pid).slice(0,20),m.name,AVATARS.includes(m.av)?m.av:AVATARS[0]);
          log(`👋 ${p.av} ${p.name} arrive.`);
        }
        connPid[id]=p.id;p.online=true;p.last=Date.now();sync();
      }else if(m.t==='ping'){const p=P(connPid[id]);if(p){p.last=Date.now();if(!p.online){p.online=true;sync()}}}
      else if(m.t==='act'){const pid=connPid[id];if(pid){const p=P(pid);if(p)p.last=Date.now();handleAct(pid,m.a||{})}}
    },
    onClose(id){const p=P(connPid[id]);delete connPid[id];if(p){p.online=Object.values(connPid).includes(p.id);sync()}},
    onError(t){
      if(t==='taken'){status('Le code est encore réservé… nouvelle tentative.');setTimeout(()=>net.retry&&net.retry(),2500)}
      else if(t==='nopeer')status('Impossible de charger le module réseau. Vérifie ta connexion internet puis recharge la page.',true);
      else status('Connexion au serveur de jeu perdue… reconnexion.',true);
    }
  });
  setInterval(hostTick,1000);
  status('Ouverture du salon…');sync();
}
function hostTick(){
  if(!G)return;const now=Date.now();let ch=false;
  G.players.forEach(p=>{if(p.id===hostPid){p.online=true;return}const on=Object.values(connPid).includes(p.id)&&now-p.last<20000;if(on!==p.online){p.online=on;ch=true}});
  if(G.phase&&G.phase.deadline&&now>G.phase.deadline){autoAct();return}
  if(ch)sync();
}
let syncT=null;
function sync(){
  if(!G)return;
  for(const [cid,pid] of Object.entries(connPid))net&&net.send(cid,{t:'view',v:viewFor(pid)});
  store.set('coupsbas-host',{G,hostPid});
  receive(viewFor(hostPid));
}

/* =====================================================================
   CÔTÉ JOUEUR
   ===================================================================== */
function clientStart(code,name,av){
  isHost=false;
  net=makeClientNet(code,{
    onOpen(){status('');net.send({t:'hello',pid:myPid,name,av})},
    onData(m){if(m.t==='view')receive(m.v);else if(m.t==='err'){status(m.msg,true)}},
    onClose(){status('Connexion perdue… reconnexion.',true)},
    onError(t){if(t==='notfound')status(`Salon ${code} introuvable. Vérifie le code (l’hôte doit avoir la page ouverte).`,true);else if(t==='nopeer')status('Impossible de charger le module réseau. Vérifie ta connexion internet puis recharge la page.',true);else status('Problème de connexion… nouvelle tentative.',true)}
  });
  setInterval(()=>net&&net.send({t:'ping'}),5000);
}
function send(a){if(isHost)handleAct(myPid,a);else net&&net.send({t:'act',a})}

  if(ph.k==='soiree_vote'){
    return `<h2>🎭 Qui est l'intrus ?</h2>${S.inIt?`<p class="small">Ton mot : <b>${esc(S.word)}</b></p>`:''}
      <div class="cluelist">${ppl.map(p=>`<button data-act="vote" data-target="${p.id}" aria-pressed="${S.myVote===p.id}" ${!S.inIt||p.id===myPid?'disabled':''}><span style="font-size:1.4rem">${p.av}</span><span style="flex:1">${esc(p.name)}${p.id===myPid?' (toi)':''}</span><b>${esc(S.clues[p.id]||'…')}</b>${S.voted.includes(p.id)?' ✅':''}</button>`).join('')}</div>
      <p class="small">${S.inIt?(S.myVote?'Vote enregistré, tu peux encore changer.':'Touche le joueur que tu soupçonnes.'):''}</p>${timerHtml()}`;
  }
  const u=v.players.find(p=>p.id===S.und);
  const cnt={};Object.values(S.votes).forEach(x=>cnt[x]=(cnt[x]||0)+1);
  return `<h2>🎭 Démasqué ?</h2><p>Mot des invités : <b>${esc(S.pair[0])}</b> · mot de l'intrus : <b>${esc(S.pair[1])}</b></p>
    <div class="cluelist">${ppl.map(p=>`<button disabled aria-pressed="${p.id===S.und}"><span style="font-size:1.4rem">${p.av}</span><span style="flex:1">${esc(p.name)}</span><b>${esc(S.clues[p.id]||'')}</b> · ${cnt[p.id]||0} vote${(cnt[p.id]||0)>1?'s':''}</button>`).join('')}</div>
    <p><b>${esc(S.txt)}</b></p><div class="acts">${ph.actor===myPid?'<button class="btn" data-act="endturn">Continuer</button>':''}</div>${timerHtml()}`;
}
function notesKey(v){return 'coupsbas-notes-'+v.gid}
function tabsHtml(v){
  const me=v.me;const tab=ui.tab;let body='';
  if(tab==='cards'){
    body=`<h2>Mes coups bas <span class="small muted" style="color:var(--ink-2)">(${me.traps.length}/5)</span></h2>
    <div class="hand" style="margin-top:8px">${me.traps.map(k=>{const t=TRAPS[k];return `<div class="tcard ${t.r?'react':'trap'}"><span class="te">${t.e}</span><b>${esc(t.n)}</b><span>${esc(t.d)}</span></div>`}).join('')||'<p class="small">Aucune carte. Passe par le Départ ou la Boutique.</p>'}</div>
    <h2 style="margin-top:14px">Mes cartes indice</h2><p class="small" style="color:var(--ink-2)">Elles sont innocentes : elles ne sont pas dans le dossier secret.</p>
    <div class="hand">${me.cards.map(c=>`<div class="tcard clue"><span class="te">${card(c).e}</span><b>${esc(card(c).n)}</b></div>`).join('')}</div>`;
  }else if(tab==='notes'){
    const marks=store.get(notesKey(v),{});
    const sec=(t,ids)=>`<tr class="h"><td colspan="2">${t}</td></tr>`+ids.map(id=>{
      const c=card(id);const mine=me.cards.includes(id);const seen=me.seen[id];const m=marks[id]||'';
      const auto=mine?'à moi':seen?'vu : '+seen:'';
      return `<tr class="${mine||seen||m==='x'?'done':''}"><td>${c.e} ${esc(c.n)}${auto?` <span class="small" style="color:var(--ink-2)">· ${esc(auto)}</span>`:''}</td><td>${mine||seen?'<span class="mk ok" style="display:inline-block;text-align:center">✗</span>':`<button class="mk ${m==='x'?'x':m==='q'?'q':''}" data-mark="${id}" aria-label="Marquer ${esc(c.n)}">${m==='x'?'✗':m==='q'?'?':'·'}</button>`}</td></tr>`}).join('');
    body=`<h2>Carnet d'enquête</h2><p class="small" style="color:var(--ink-2)">Barré = innocent. Touche une ligne pour noter ✗ (innocent) ou ? (suspect).</p><table class="note">${sec('Qui ?',v.pool.s)}${sec('Avec quoi ?',v.pool.o)}${sec('Où ?',v.pool.l)}</table>`;
  }else if(tab==='players'){
    body=`<h2>Joueurs</h2><div class="ptable">${v.players.map(p=>{const rooms=Object.entries(v.owners).filter(([,o])=>o.pid===p.id).map(([c])=>ROOMS[BOARD[c].r].e).join('');
      return `<div class="prow ${p.id===v.cur?'cur':''}"><span class="av">${p.av}</span><div style="min-width:0"><b>${esc(p.name)}</b>${p.id===myPid?' (toi)':''} ${p.online?'':'<span class="small">· hors ligne</span>'}<div class="meta">${rooms||'aucune pièce'} · ${p.nTraps} coup${p.nTraps>1?'s':''} bas · ${p.nCards} indices${p.skip?' · ⛔ saute un tour':''}${p.cave?' · 🕳️ à la Cave':''}${p.bailiff?' · 💼':''}${p.noAcc?' · ne peut pas accuser':''}</div></div><span class="g">${p.gold} 🪙<div class="meta" style="text-align:right">fortune ${p.f}</div></span></div>`}).join('')}</div>`;
  }else{
    body=`<h2>Journal</h2><div class="logl">${v.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
  }
  return `<div class="tabs" role="tablist">${[['cards','Mes cartes'],['notes','Carnet'],['players','Joueurs'],['log','Journal']].map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div><section class="panel" id="tabp">${body}</section>`;
}
function accuseModal(v){
  return `<div class="modal" id="accModal"><section class="panel"><h2>⚖️ Accusation</h2>
    <p class="small">${v.mode==='facile'?'Raté : tu perds 100 et attends 2 tours.':'Raté : tu perds la moitié de ta fortune et ne peux plus accuser.'} Juste : tu gagnes la partie !</p>
    <p class="label" style="color:var(--ink-2);margin-top:8px">Qui ?</p>${chipList(v.pool.s,'as',ui.sel.as)}
    <p class="label" style="color:var(--ink-2);margin-top:8px">Avec quoi ?</p>${chipList(v.pool.o,'ao',ui.sel.ao)}
    <p class="label" style="color:var(--ink-2);margin-top:8px">Où ?</p>${chipList(v.pool.l,'al',ui.sel.al)}
    <div class="acts"><button class="btn red" data-act="doAccuse" ${ui.sel.as&&ui.sel.ao&&ui.sel.al?'':'disabled'}>J'accuse !</button><button class="btn alt" data-act="closeAccuse">Annuler</button></div></section></div>`;
}
function renderEnd(v){
  const w=v.winner?v.players.find(p=>p.id===v.winner):null;const S=v.solution;
  const first=v.players.find(p=>p.id===v.ranking[0].id);
  app.innerHTML=`<div class="top"><span class="brand">Coups Bas !</span></div>
  <section class="panel" style="text-align:center">
    <h2 style="font-size:2rem">${w?`🏆 ${w.av} ${esc(w.name)} a résolu l'affaire !`:`🏆 ${first.av} ${esc(first.name)} gagne à la fortune !`}</h2>
    <p>La vérité sur le gâteau de Mamie :</p>
    <div class="sol"><div><span>${card(S.s).e}</span>${esc(card(S.s).n)}</div><div><span>${card(S.o).e}</span>${esc(card(S.o).n)}</div><div><span>${card(S.l).e}</span>${esc(card(S.l).n)}</div></div>
    <div class="rank">${v.ranking.map((r,i)=>{const p=v.players.find(x=>x.id===r.id);return `<div><span class="n">${i+1}</span><span style="font-size:1.6rem">${p.av}</span><b style="flex:1;text-align:left">${esc(p.name)}</b><span>${r.f} 🪙</span></div>`}).join('')}</div>
    <div class="acts" style="justify-content:center">${myPid===v.host?'<button class="btn" data-act="again">Rejouer avec les mêmes</button>':'<p class="small">L’hôte peut relancer une partie.</p>'}</div>
  </section>
  <section class="panel" style="margin-top:14px"><h2>Journal</h2><div class="logl">${v.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></section>`;
}
function renderGame(v){
  const me=v.players.find(p=>p.id===myPid);
  const scrollY=window.scrollY;
  const focusId=document.activeElement&&document.activeElement.id;
  if($('#clueIn'))ui.draft.clue=$('#clueIn').value;
  app.innerHTML=`
  <div class="top"><span class="brand">Coups Bas !</span><span class="pill">${me?me.av+' '+esc(me.name):''}</span><span class="pill"><b>${me?me.gold:0}</b> 🪙</span><span class="pill">Salon <b>${esc(v.code)}</b></span><span class="pill">${v.mode==='facile'?'Facile':'Normal'}</span></div>
  <p id="status" class="${ui.statusErr?'err':'muted small'}" ${ui.statusMsg?'':'hidden'}>${esc(ui.statusMsg)}</p>
  <div class="game">
    <div>${renderBoard(v)}</div>
    <div class="side">${actionPanel(v)}${tabsHtml(v)}</div>
  </div>
  ${ui.accuse?accuseModal(v):''}`;
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(el.setSelectionRange&&el.value)el.setSelectionRange(el.value.length,el.value.length)}}
  window.scrollTo(0,scrollY);
}
function render(){
  const v=V;if(!v)return;
  if(v.status==='lobby')renderLobby(v);
  else if(v.status==='end')renderEnd(v);
  else renderGame(v);
  if(v.status!=='lobby')bindGame();
}
function receive(v){
  const prev=V;V=v;
  if(v.phase&&v.phase.left!=null){ui.deadline=Date.now()+v.phase.left;ui.total=v.phase.total||20}
  if(v.me){v.me.inbox.forEach(m=>{if(m.i>ui.lastInbox){if(prev||m.i>ui.lastInbox)toast(m.t)}});ui.lastInbox=Math.max(ui.lastInbox,...v.me.inbox.map(m=>m.i),0)}
  if(v.status==='play'&&v.cur===myPid&&ui.lastTurnPid!==myPid&&v.phase&&['start','cave'].includes(v.phase.k)){banner('À toi !');beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
  if(v.status==='play')ui.lastTurnPid=v.cur;
  if(v.phase&&v.phase.k==='react'&&v.phase.actor===myPid&&(!prev||!prev.phase||prev.phase.k!=='react')){beep();try{navigator.vibrate&&navigator.vibrate([100,60,100])}catch(e){}}
  if(v.phase&&v.phase.k==='soiree_clue'&&(!prev||!prev.phase||prev.phase.k!=='soiree_clue')){banner('🎭 Soirée masquée !');ui.draft.clue=''}
  if(v.status==='end'&&prev&&prev.status!=='end')banner('Fin de partie !');
  if(v.phase&&prev&&prev.phase&&(prev.phase.k!==v.phase.k||prev.cur!==v.cur)){ui.sel={}}
  if(!prev||prev.status!==v.status)ui.accuse=false;
  render();
  if(v.lastRoll)ui.lastRoll=v.lastRoll.i;
}
function bindGame(){
  app.onclick=e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    const d=b.dataset;
    if(d.tab){ui.tab=d.tab;sstore.set('tab',d.tab);return render()}
    if(d.trap!=null){const i=+d.trap;ui.sel.trap=ui.sel.trap===i?null:i;return render()}
    if(d.sel){
      if(d.sel==='passage'){send({type:'passage',r:d.val});return}
      ui.sel[d.sel]=ui.sel[d.sel]===d.val?null:d.val;return render()}
    if(d.mark){const k=notesKey(V);const m=store.get(k,{});m[d.mark]=m[d.mark]==='x'?'q':m[d.mark]==='q'?'':'x';store.set(k,m);return render()}
    switch(d.act){
      case 'roll':send({type:'roll',v:d.v?+d.v:0});break;
      case 'play':{const i=ui.sel.trap;ui.sel.trap=null;send({type:'play',idx:i,target:d.target});break}
      case 'cave':case 'rent':send({type:d.act,choice:d.choice});break;
      case 'buy':case 'pass':case 'renovate':send({type:d.act});break;
      case 'suggest':send({type:'suggest'});break;
      case 'doSuggest':send({type:'suggest',s:ui.sel.s,o:ui.sel.o,l:ui.sel.l});ui.sel={};break;
      case 'show':send({type:'show',card:d.card});break;
      case 'react':send({type:'react',choice:d.choice});break;
      case 'duel':send({type:'duel',target:d.target});break;
      case 'shop':send({type:'shop',i:+d.i});break;
      case 'endturn':send({type:'endturn'});break;
      case 'vote':send({type:'vote',target:d.target});break;
      case 'openAccuse':ui.accuse=true;render();break;
      case 'closeAccuse':ui.accuse=false;render();break;
      case 'doAccuse':send({type:'accuse',s:ui.sel.as,o:ui.sel.ao,l:ui.sel.al});ui.accuse=false;ui.sel={};break;
      case 'again':send({type:'again'});break;
    }
  };
  app.onsubmit=e=>{if(e.target.id==='clueForm'){e.preventDefault();const w=$('#clueIn').value.trim();if(w){send({type:'clue',w});ui.draft.clue=''}}};
  app.oninput=e=>{if(e.target.id==='clueIn')ui.draft.clue=e.target.value};
}
setInterval(()=>{const t=$('#tbar');if(t){const pct=Math.max(0,Math.min(100,(ui.deadline-Date.now())/ui.total/10));t.style.width=pct+'%'}},500);

/* --- Démarrage --- */
(function boot(){
  const s=sstore.get('coupsbas-session',null);
  myPid=sstore.get('coupsbas-pid',null);
  if(s&&myPid){
    if(s.host){const saved=store.get('coupsbas-host',null);if(saved&&saved.G&&saved.G.code===s.code&&saved.hostPid===myPid){hostStart(s.code,saved.G);return}}
    else{app.innerHTML=`<div class="hero"><h1 class="logo">Coups Bas !</h1><p class="tag">Reconnexion au salon <b>${esc(s.code)}</b>…</p><p id="status" hidden></p><button class="btn ghost" id="leave">Quitter</button></div>`;
      $('#leave').onclick=()=>{sessionStorage.clear();location.href=location.pathname+(LOCAL?'?local=1':'')};
      clientStart(s.code,s.name,s.av);return}
  }
  renderHome();
})();
</script>
</body>
</html>
