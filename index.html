<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14102a">
<title>Coups Bas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Manoir de nuit : fond violet nuit, cartes crème, laiton. Une colonne pensée pour le téléphone. */
:root{
  --night:#14102a; --night-2:#0d0a1d; --night-3:#231c45;
  --brass:#e7bd52; --brass-2:#b8902f;
  --cream:#f7eedb; --cream-2:#e8dcc2; --ink:#221d17; --ink-2:#5b5244;
  --red:#e0523f; --red-2:#9c3326; --blue:#6aa5ea; --ok:#3daa68; --muted:#a9a2c9; --wolf:#8a2f2f;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,var(--night-3),var(--night) 55%,var(--night-2));background-color:var(--night);color:var(--cream);font:16px/1.4 var(--body);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:max(10px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.day{background:radial-gradient(ellipse at 50% -10%,#3c5f86,#24405e 55%,#18304a);background-color:#24405e}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
.btn{border:0;border-radius:999px;padding:.75em 1.25em;background:var(--brass);color:var(--ink);font-weight:600;box-shadow:0 3px 0 var(--brass-2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--cream-2);box-shadow:0 3px 0 #c9b893}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-2)}
.btn.green{background:var(--ok);color:#fff;box-shadow:0 3px 0 #23744a}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #3d6fae}
.btn.sm{padding:.45em .9em;font-size:.9rem}
.btn.big{font-size:1.1rem;padding:.85em 1.4em}
.btn:focus-visible,.chip:focus-visible,.pick:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:.85rem}
.muted{color:var(--muted)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.card h2{font-size:1.45rem;color:var(--night)}
.stack{display:grid;gap:12px;margin-top:10px}
.field{display:grid;gap:6px}
.field input{background:#fff;border:2px solid var(--cream-2);border-radius:10px;color:var(--ink);padding:.6em .8em}
.field input:focus{border-color:var(--night);outline:none}
.avatars{display:flex;flex-wrap:wrap;gap:6px}
.avatars button{font-size:1.5rem;width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:var(--cream-2)}
.avatars button[aria-pressed="true"]{border-color:var(--night);background:#fff;transform:scale(1.08)}
.seg{display:flex;background:var(--cream-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;border-radius:9px;padding:.55em .4em;background:transparent;color:var(--ink-2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--cream)}
.seg button small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.games{display:grid;gap:8px}
.gpick{display:flex;gap:12px;align-items:center;text-align:left;border:3px solid var(--cream-2);background:#fff;border-radius:16px;padding:10px 12px;color:var(--ink)}
.gpick[aria-pressed="true"]{border-color:var(--night);background:#efe8ff}
.gpick .ge{font-size:2.2rem}
.gpick b{font-family:var(--display);font-weight:400;font-size:1.2rem;display:block}
.gpick span{font-size:.82rem;color:var(--ink-2)}
.hero{text-align:center;padding:12px 0 4px}
.logo{font-family:var(--display);font-size:clamp(2.8rem,13vw,5rem);line-height:.9;color:var(--brass);text-shadow:0 4px 0 #6d5418,0 10px 24px rgba(0,0,0,.5);transform:rotate(-3deg);display:inline-block}
.logo small{display:block;font-size:.3em;color:var(--cream);text-shadow:none;transform:rotate(2deg);margin-top:8px;letter-spacing:.05em}
.tag{max-width:520px;margin:12px auto 0;color:var(--cream-2)}
.home{display:grid;gap:14px;margin-top:16px}
.code{font-family:var(--display);font-size:clamp(3rem,16vw,4.5rem);letter-spacing:.12em;color:var(--night);line-height:1}
.qr{background:#fff;padding:8px;border-radius:12px;display:inline-block;margin-top:10px}
.qr img,.qr canvas{display:block;width:140px;height:140px}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.linkbox code{background:var(--cream-2);padding:.35em .6em;border-radius:8px;font-size:.78rem;word-break:break-all;min-width:0;flex:1}
.plist{display:grid;gap:6px;margin-top:10px}
.pl{display:flex;align-items:center;gap:10px;background:var(--cream-2);border-radius:12px;padding:6px 10px}
.pl .av{font-size:1.5rem}
.pl .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:#999}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top .brand{font-family:var(--display);color:var(--brass);font-size:1.3rem;transform:rotate(-2deg);margin-right:auto}
.pill{background:rgba(0,0,0,.3);border-radius:999px;padding:.3em .8em;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--brass)}
/* --- table des joueurs --- */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.seat{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:14px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.seat.turn{border-color:var(--brass);background:rgba(231,189,82,.15)}
.seat.out{opacity:.45}
.seat.me{background:rgba(255,255,255,.16)}
.seat .nm{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.seat .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .av{font-size:1.4rem}
.seat .info{display:flex;gap:6px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.mini{display:inline-grid;place-items:center;width:26px;height:34px;border-radius:5px;background:linear-gradient(135deg,#4b3d8f,#2a2160);border:1px solid #6c5cc0;font-size:.9rem}
.mini.dead{background:#3a3a3a;border-color:#555;filter:grayscale(1);opacity:.85}
.coins{font-family:var(--display);color:var(--brass);font-variant-numeric:tabular-nums}
.claims{font-size:.72rem;color:var(--muted);min-height:1em}
/* --- panneau d'action --- */
.panel{background:var(--cream);color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.panel.mine{box-shadow:0 0 0 4px var(--brass),0 6px 0 rgba(0,0,0,.3)}
.panel h2{font-size:1.35rem;color:var(--night)}
.panel p{margin:.45em 0}
.acts{display:grid;gap:8px;margin-top:10px}
.acts.two{grid-template-columns:1fr 1fr}
.abtn{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--cream-2);background:#fff;border-radius:14px;padding:8px 12px;color:var(--ink)}
.abtn .ae{font-size:1.6rem;width:1.6em;text-align:center}
.abtn b{display:block}
.abtn small{color:var(--ink-2);font-size:.78rem}
.abtn.bluff{border-style:dashed;border-color:var(--red)}
.abtn.honest{border-color:var(--ok)}
.abtn:disabled{opacity:.4}
.abtn[aria-pressed="true"]{border-color:var(--night);background:#efe8ff}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--cream-2);background:#fff;color:var(--ink);border-radius:14px;padding:.5em .8em;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--night);background:var(--night);color:var(--cream)}
.chip:disabled{opacity:.4}
.chip .n{font-size:.75rem;font-weight:500;opacity:.8}
.hand{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.char{width:118px;border-radius:14px;padding:10px;background:linear-gradient(160deg,#fff,var(--cream));border:3px solid var(--night);color:var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.char .ce{font-size:2rem}
.char b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.char span{font-size:.72rem;color:var(--ink-2);line-height:1.2}
.char.dead{filter:grayscale(1);opacity:.55;border-color:#888}
.char[aria-pressed="true"]{outline:4px solid var(--red);transform:translateY(-4px)}
button.char{cursor:pointer}
.timer{height:7px;background:var(--cream-2);border-radius:7px;overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--night);transition:width .5s linear}
.done{font-size:.82rem;color:var(--ink-2);margin-top:8px}
.big{font-family:var(--display);font-size:1.4rem;color:var(--night);text-align:center;margin:8px 0;text-wrap:balance}
.verdict{background:var(--night);color:var(--cream);border-radius:14px;padding:12px;text-align:center;margin-top:8px}
.verdict .v{font-family:var(--display);font-size:1.6rem;color:var(--brass)}
.role{background:var(--night);color:var(--cream);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.role .re{font-size:2.4rem}
.role b{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--brass);display:block}
.role span{font-size:.85rem;color:var(--cream-2)}
.role.wolf{background:var(--wolf)}
.cheat{margin-top:12px;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;font-size:.85rem;color:var(--cream-2)}
.cheat summary{cursor:pointer;font-weight:600;color:var(--brass)}
.cheat table{width:100%;border-collapse:collapse;margin-top:6px}
.cheat td{padding:4px 4px;border-top:1px solid rgba(255,255,255,.1);vertical-align:top}
/* --- discussion --- */
.chat{margin-top:12px}
.chat h3{font-size:1.1rem;color:var(--brass)}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;padding:4px 2px;margin-top:6px}
.msg{background:var(--cream);color:var(--ink);border-radius:14px;border-bottom-left-radius:4px;padding:6px 10px;max-width:88%;align-self:flex-start}
.msg.mine{align-self:flex-end;background:var(--brass);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg.wolf{background:#f3d2d2;border:2px solid var(--wolf)}
.msg.sys{align-self:center;background:rgba(0,0,0,.3);color:var(--cream-2);font-size:.85rem;text-align:center;max-width:100%}
.msg .mh{font-size:.72rem;font-weight:600;opacity:.75}
.compose{display:flex;gap:8px;margin-top:8px}
.compose select,.compose input{background:#fff;border:2px solid var(--cream-2);border-radius:10px;color:var(--ink);padding:.5em .6em;min-width:0}
.compose input{flex:1;width:0}
.compose select{max-width:40%}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
.quick button{flex:none;border:0;background:rgba(255,255,255,.14);color:var(--cream);border-radius:999px;padding:.35em .8em;font-size:.82rem}
.log{display:grid;gap:4px;margin-top:10px;font-size:.85rem}
.log div{background:rgba(0,0,0,.25);border-radius:10px;padding:5px 10px;color:var(--cream-2)}
.log div:first-child{color:var(--cream);font-weight:600}
.toasts{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px;justify-items:center;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:var(--cream);border:2px solid var(--brass);border-radius:14px;padding:10px 14px;max-width:min(520px,100%);box-shadow:0 8px 20px rgba(0,0,0,.4);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:45;overflow:hidden}
.banner div{font-family:var(--display);font-size:clamp(1.8rem,9vw,4rem);color:var(--brass);text-shadow:0 4px 0 #6d5418,0 0 30px rgba(0,0,0,.7);animation:pop 1.8s ease-out forwards;text-align:center;padding:0 16px;max-width:100%;overflow-wrap:anywhere}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.08) rotate(-3deg);opacity:1}80%{opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:0}}
.err{background:var(--red);color:#fff;border-radius:10px;padding:8px 12px;margin-top:10px}
.rules{margin-top:16px;background:rgba(0,0,0,.25);border-radius:16px;padding:12px 16px}
.rules summary{font-family:var(--display);font-size:1.2rem;cursor:pointer;color:var(--brass)}
.rules p,.rules li{color:var(--cream-2);max-width:68ch}
.rules ul{padding-left:1.2em}
.foot{text-align:center;margin-top:18px;font-size:.85rem}
.foot a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="banner" id="banner"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';
/* =====================================================================
   COUPS BAS — deux jeux de bluff : « Le Bluff » (personnages secrets,
   façon Coup) et « Loup-garou ». Le téléphone de l'hôte tient la partie
   et n'envoie à chacun que ce qu'il a le droit de voir. Solo : l'hôte
   joue seul contre des robots, sans réseau. ?local=1 : test multi-onglets.
   ===================================================================== */
const AVATARS=['🦊','🐼','🐸','🦁','🐷','🐵','🦄','🐙','🐔','🐻','🐯','🐨'];
const BOTS=[['Gaston','🤖'],['Mamie Bot','👾'],['Jade','🦾'],['Firmin','📟'],['Mistigri','🛸'],['Bernard','🎰'],['Huguette','🔋']];
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const chance=p=>Math.random()<p;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sstore={get(k,d){try{const v=sessionStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------------- Le Bluff : données ---------------- */
const CHARS={
  banquier:{n:'Banquier',e:'🎩',a:'Taxe : +3 pièces',b:"Bloque l'Aide de Mamie"},
  assassin:{n:'Assassin',e:'🗡️',a:'Paie 3 : la cible perd une carte',b:''},
  voleur:{n:'Voleur',e:'🦹',a:'Vole 2 pièces à quelqu’un',b:'Bloque un vol'},
  espion:{n:'Espion',e:'🕵️',a:'Échange : pioche 2 cartes et garde les meilleures',b:'Bloque un vol'},
  comtesse:{n:'Comtesse',e:'👸',a:'—',b:'Bloque un assassinat'}};
const ACTIONS={
  revenu:{n:'Revenu',e:'🪙',d:'+1 pièce. Personne ne peut s’y opposer.'},
  aide:{n:'Aide de Mamie',e:'👵',d:'+2 pièces. Un Banquier peut bloquer.',blockBy:['banquier'],blockAll:1},
  taxe:{n:'Taxe',e:'🎩',d:'+3 pièces.',claim:'banquier'},
  vol:{n:'Vol',e:'🦹',d:'Prends 2 pièces à un joueur.',claim:'voleur',blockBy:['voleur','espion'],target:1},
  assassinat:{n:'Assassinat',e:'🗡️',d:'Paie 3 : la cible perd une carte.',claim:'assassin',blockBy:['comtesse'],target:1,cost:3},
  echange:{n:'Échange',e:'🕵️',d:'Pioche 2 cartes, garde celles que tu veux.',claim:'espion'},
  coup:{n:'Coup fatal',e:'💥',d:'Paie 7 : la cible perd une carte. Imparable.',target:1,cost:7}};
/* ---------------- Loup-garou : données ---------------- */
const ROLES={
  loup:{n:'Loup-garou',e:'🐺',d:'Chaque nuit, les loups dévorent un villageois. Le jour, fais-toi passer pour un innocent.',team:'loups'},
  voyante:{n:'Voyante',e:'🔮',d:'Chaque nuit, découvre le rôle d’un joueur. Attention : te révéler fait de toi une cible.',team:'village'},
  sorciere:{n:'Sorcière',e:'🧪',d:'Une potion de vie (sauver la victime des loups) et une potion de mort, une fois chacune.',team:'village'},
  chasseur:{n:'Chasseur',e:'🏹',d:'Si tu meurs, tu emportes quelqu’un avec toi.',team:'village'},
  villageois:{n:'Villageois',e:'🧑‍🌾',d:'Aucun pouvoir, mais ton vote compte. Démasque les loups !',team:'village'}};
function compo(n,mode){
  const r=['loup','voyante'];if(n>=6)r.push('loup');
  if(mode==='normal'){if(n>=5)r.push('sorciere');if(n>=6)r.push('chasseur')}
  while(r.length<n)r.push('villageois');return shuffle(r);
}

/* =====================================================================
   MOTEUR COMMUN (chez l'hôte)
   ===================================================================== */
let G=null;
const P=id=>G.players.find(p=>p.id===id);
const nm=p=>p?`${p.av} ${p.name}`:'?';
function newGame(code,game,mode){return {code,id:uid(),game,mode,status:'lobby',players:[],log:[],msgs:[],phase:null,seq:0,solo:false}}
function log(t){G.log.unshift(t);G.log.length=Math.min(G.log.length,40)}
function tell(p,t){if(!p||p.bot)return;p.inbox.push({i:++G.seq,t});if(p.inbox.length>8)p.inbox.shift()}
function say(from,to,txt){G.msgs.push({i:++G.seq,from,to,txt:String(txt).slice(0,160)});if(G.msgs.length>150)G.msgs.shift()}
function sys(txt){say(null,'all',txt)}
function addPlayer(id,name,av,bot){
  const used=G.players.map(p=>p.av);if(used.includes(av))av=AVATARS.find(a=>!used.includes(a))||av;
  const p={id,name:String(name||'Joueur').slice(0,14),av,bot:!!bot,inbox:[],online:true,last:Date.now(),wins:0};
  G.players.push(p);return p;
}
function phase(k,secs,data={}){G.phase={k,...data,start:Date.now(),deadline:G.solo||!secs?null:Date.now()+secs*1000,total:G.solo?null:secs}}
function alive(){return G.players.filter(p=>!p.out)}
function startGame(){
  G.log=[];G.msgs=[];G.status='play';G.winner=null;G.end=null;
  G.players.forEach(p=>{p.out=false;p.inbox=[]});
  if(G.game==='bluff')bluffStart();else loupStart();
}
function endGame(winners,txt){
  G.status='end';G.phase={k:'over'};G.end={winners,txt};
  winners.forEach(id=>{const p=P(id);if(p)p.wins++});
  log('🏆 '+txt);sys('🏆 '+txt);
}

/* =====================================================================
   LE BLUFF (façon Coup)
   ===================================================================== */
let B=null;
function bluffStart(){
  const n=G.players.length;const copies=n<=6?3:4;
  const deck=[];Object.keys(CHARS).forEach(c=>{for(let i=0;i<copies;i++)deck.push(c)});shuffle(deck);
  G.B=B={deck,copies,cur:rnd(n),claims:{},turn:0};
  G.players.forEach(p=>{p.coins=2;p.cards=[{c:deck.pop(),dead:false},{c:deck.pop(),dead:false}];B.claims[p.id]=[]});
  log('🎭 Chacun reçoit 2 personnages secrets. Dernier en jeu = vainqueur.');
  bTurn();
}
const liveCards=p=>p.cards.filter(c=>!c.dead);
function bTurn(){
  const p=G.players[B.cur];
  if(p.out)return bNext();

}
function bNext(){
  const al=alive();if(al.length<=1)return endGame(al.map(p=>p.id),`${nm(al[0])} remporte Le Bluff !`);
  const n=G.players.length;let i=B.cur;do{i=(i+1)%n}while(G.players[i].out);B.cur=i;bTurn();
}
function claim(pid,c){const a=B.claims[pid];if(!a.includes(c))a.push(c)}
function bAction(p,a){
  const A=ACTIONS[a.act];if(!A)return 'Action inconnue.';
  if(p.coins>=10&&a.act!=='coup')return 'Avec 10 pièces ou plus, le Coup fatal est obligatoire.';
  if(A.cost&&p.coins<A.cost)return `Il faut ${A.cost} pièces.`;
  let t=null;if(A.target){t=P(a.target);if(!t||t.out||t.id===p.id)return 'Choisis une cible encore en jeu.';if(a.act==='vol'&&t.coins<1)return 'Cette cible n’a plus de pièces.'}
  const act={act:a.act,actor:p.id,target:t?t.id:null};
  log(`${A.e} ${nm(p)} : ${A.n}${t?` sur ${nm(t)}`:''}${A.claim?` (prétend être ${CHARS[A.claim].e} ${CHARS[A.claim].n})`:''}`);
  if(A.claim)claim(p.id,A.claim);
  if(A.cost===7){p.coins-=7}
  const elig=new Set();
  if(A.claim)alive().forEach(q=>{if(q.id!==p.id)elig.add(q.id)});
  if(A.blockBy){if(A.blockAll)alive().forEach(q=>{if(q.id!==p.id)elig.add(q.id)});else if(t)elig.add(t.id)}
  if(!elig.size)return bResolve(act);
  phase('respond',15,{actor:p.id,stage:'action',...act,elig:[...elig],passed:[]});
}
function bRespond(q,r){
  const ph=G.phase;if(ph.k!=='respond'||!ph.elig.includes(q.id)||ph.passed.includes(q.id))return;
  const act={act:ph.act,actor:ph.actor,target:ph.target};const A=ACTIONS[ph.act];
  if(r.type==='pass'){ph.passed.push(q.id);if(ph.passed.length>=ph.elig.length){if(ph.stage==='action')bResolve(act);else bBlocked(act,ph)}return}
  if(r.type==='challenge'){
    if(ph.stage==='action'&&!A.claim)return;
    const accused=P(ph.stage==='action'?ph.actor:ph.blocker);const ch=ph.stage==='action'?A.claim:ph.blockChar;
    log(`❗ ${nm(q)} crie « MENTEUR ! » à ${nm(accused)} (${CHARS[ch].e} ${CHARS[ch].n} ?)`);
    const has=liveCards(accused).find(c=>c.c===ch);
    if(has){
      log(`✅ ${nm(accused)} avait bien ${CHARS[ch].e} ${CHARS[ch].n} ! ${q.name} perd une carte.`);
      B.deck.push(has.c);shuffle(B.deck);has.c=B.deck.pop();tell(accused,`🔄 Ta carte révélée retourne dans la pioche, tu reçois ${CHARS[has.c].e} ${CHARS[has.c].n}.`);
      B.reveal={who:accused.id,c:ch,ok:true,by:q.id};
      return bLose(q,ph.stage==='action'?{then:'resolve',act}:{then:'blocked',act,ph:{blocker:ph.blocker,blockChar:ph.blockChar}},'Mauvaise accusation');
    }
    log(`🤥 ${nm(accused)} BLUFFAIT ! Il perd une carte.`);B.reveal={who:accused.id,c:ch,ok:false,by:q.id};
    return bLose(accused,ph.stage==='action'?{then:'next'}:{then:'resolve',act},'Bluff démasqué');
  }
  if(r.type==='block'){
    if(ph.stage!=='action'||!A.blockBy||!A.blockBy.includes(r.c))return;
    if(!A.blockAll&&q.id!==ph.target)return;
    claim(q.id,r.c);
    log(`🛑 ${nm(q)} bloque avec ${CHARS[r.c].e} ${CHARS[r.c].n} !`);
    const elig=alive().filter(x=>x.id!==q.id).map(x=>x.id);
    phase('respond',15,{actor:ph.actor,stage:'block',...act,blocker:q.id,blockChar:r.c,elig,passed:[]});
  }
}
function bBlocked(act,ph){
  const p=P(act.actor);const A=ACTIONS[act.act];
  if(act.act==='assassinat')p.coins=Math.max(0,p.coins-3);
  log(`🛑 L'action de ${nm(p)} est bloquée.`);bNext();
}
function bResolve(act){
  const p=P(act.actor);const t=act.target?P(act.target):null;
  if(p.out)return bNext();
  switch(act.act){
    case 'revenu':p.coins+=1;break;
    case 'aide':p.coins+=2;break;
    case 'taxe':p.coins+=3;break;
    case 'vol':{const x=Math.min(2,t.coins);t.coins-=x;p.coins+=x;log(`🦹 ${p.name} prend ${x} pièce${x>1?'s':''} à ${t.name}.`);break}
    case 'assassinat':p.coins=Math.max(0,p.coins-3);if(t&&!t.out)return bLose(t,{then:'next'},'Assassiné');break;
    case 'coup':if(t&&!t.out)return bLose(t,{then:'next'},'Coup fatal');break;
    case 'echange':{const opts=[...liveCards(p).map(c=>c.c),B.deck.pop(),B.deck.pop()].filter(Boolean);return phase('exchange',40,{actor:p.id,opts,keep:liveCards(p).length})}
  }
  bNext();
}
function bLose(p,after,why){
  const lc=liveCards(p);if(!lc.length){return bAfter(after)}
  if(lc.length===1){return bKill(p,0,after,why)}
  phase('lose',25,{actor:p.id,after,why});
}
function bKill(p,idx,after,why){
  const lc=liveCards(p);const c=lc[Math.min(idx,lc.length-1)];c.dead=true;
  log(`💀 ${nm(p)} révèle ${CHARS[c.c].e} ${CHARS[c.c].n}${why?` (${why})`:''}.`);
  if(!liveCards(p).length){p.out=true;log(`☠️ ${nm(p)} est éliminé !`);sys(`☠️ ${nm(p)} est éliminé du Bluff.`)}
  if(alive().length<=1){const w=alive()[0];return endGame([w.id],`${nm(w)} remporte Le Bluff !`)}
  bAfter(after);
}
function bAfter(after){
  if(after.then==='resolve')return bResolve(after.act);
  if(after.then==='blocked')return bBlocked(after.act,after.ph);
  bNext();
}
function bExchange(p,keep){
  const ph=G.phase;const opts=[...ph.opts];const k=[];
  (keep||[]).forEach(i=>{if(opts[i]!=null&&k.length<ph.keep){k.push(opts[i]);opts[i]=null}});
  while(k.length<ph.keep){const i=opts.findIndex(x=>x!=null);k.push(opts[i]);opts[i]=null}
  opts.filter(x=>x!=null).forEach(c=>B.deck.push(c));shuffle(B.deck);
  const lc=liveCards(p);lc.forEach((c,i)=>c.c=k[i]);
  log(`🕵️ ${nm(p)} a échangé ses cartes.`);bNext();
}
/* --- Robots du Bluff --- */
function knownCount(bot,c){let k=0;G.players.forEach(p=>p.cards.forEach(x=>{if(x.c===c&&(x.dead||p.id===bot.id))k++}));return k}
function suspicion(bot,claimer,c,targetsMe){
  if(knownCount(bot,c)>=B.copies)return 1;
  let s=G.mode==='facile'?.06:.12;
  if(targetsMe)s+=.18;
  if(B.claims[claimer.id].length>=3)s+=.15;
  s+=.06*knownCount(bot,c);
  if(liveCards(bot).length===1)s*=.5;
  if(liveCards(claimer).length===1&&targetsMe)s+=.1;
  return Math.min(.9,s);
}
function botBluff(b){
  const ph=G.phase;const el=Date.now()-ph.start;
  if(ph.k==='action'&&ph.actor===b.id&&el>1600+rnd(1500)){
    const mine=liveCards(b).map(c=>c.c);const others=alive().filter(x=>x.id!==b.id);
    const threat=[...others].sort((x,y)=>liveCards(y).length-liveCards(x).length||y.coins-x.coins)[0];
    const has=c=>mine.includes(c);const bluff=G.mode==='facile'?.15:.3;
    let a;
    if(b.coins>=7)a={act:'coup',target:threat.id};
    else if(b.coins>=3&&(has('assassin')||chance(bluff*.6)))a={act:'assassinat',target:threat.id};
    else if(has('banquier')||chance(bluff))a={act:'taxe'};
    else{const rich=others.filter(x=>x.coins>=2);if(rich.length&&(has('voleur')||chance(bluff*.7)))a={act:'vol',target:pick(rich).id};
      else if(has('espion')&&chance(.4))a={act:'echange'};else a={act:chance(.5)?'aide':'revenu'}}
    const e=bAction(b,a);if(e)bAction(b,{act:'revenu'});
    return true;
  }
  if(ph.k==='respond'&&ph.elig.includes(b.id)&&!ph.passed.includes(b.id)&&el>1400+rnd(2500)){
    const A=ACTIONS[ph.act];const mine=liveCards(b).map(c=>c.c);const actor=P(ph.actor);
    if(ph.stage==='action'){
      if(A.blockBy&&(A.blockAll||ph.target===b.id)){
        const real=A.blockBy.find(c=>mine.includes(c));
        if(real&&(ph.target===b.id||chance(.5)))return bRespond(b,{type:'block',c:real}),true;
        const dying=ph.act==='assassinat'&&ph.target===b.id&&liveCards(b).length===1;
        if(!real&&ph.target===b.id&&chance(dying?.65:G.mode==='facile'?.1:.22))return bRespond(b,{type:'block',c:pick(A.blockBy)}),true;
      }
      if(A.claim&&chance(suspicion(b,actor,A.claim,ph.target===b.id)))return bRespond(b,{type:'challenge'}),true;
    }else{
      const blocker=P(ph.blocker);
      if(chance(suspicion(b,blocker,ph.blockChar,ph.actor===b.id)))return bRespond(b,{type:'challenge'}),true;
    }
    bRespond(b,{type:'pass'});return true;
  }
  if(ph.k==='lose'&&ph.actor===b.id&&el>1000){const lc=liveCards(b);const keepOrder=['assassin','banquier','comtesse','voleur','espion'];const worst=lc.map((c,i)=>[keepOrder.indexOf(c.c),i]).sort((x,y)=>y[0]-x[0])[0][1];bKill(b,worst,ph.after,ph.why);return true}
  if(ph.k==='exchange'&&ph.actor===b.id&&el>1200){const pref=['assassin','banquier','comtesse','voleur','espion'];const idx=ph.opts.map((c,i)=>[pref.indexOf(c),i]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);bExchange(b,idx.slice(0,ph.keep));return true}
  return false;
}
function bluffAuto(){
  const ph=G.phase;
  if(ph.k==='action')bAction(P(ph.actor),{act:P(ph.actor).coins>=10?'coup':'revenu',target:pick(alive().filter(x=>x.id!==ph.actor)).id});
  else if(ph.k==='respond'){[...ph.elig].forEach(id=>{if(G.phase===ph&&!ph.passed.includes(id))bRespond(P(id),{type:'pass'})})}
  else if(ph.k==='lose')bKill(P(ph.actor),0,ph.after,ph.why);
  else if(ph.k==='exchange')bExchange(P(ph.actor),[]);
}

/* =====================================================================

let L=null;
function loupStart(){
  const roles=compo(G.players.length,G.mode);
  G.L=L={round:1,potions:{vie:true,mort:true},seen:{},claims:[],dead:{},night:null,votes:{},sus:{}};
  G.players.forEach((p,i)=>{p.role=roles[i];L.seen[p.id]={}});
  const wolves=G.players.filter(p=>p.role==='loup');
  G.players.forEach(p=>tell(p,`Ton rôle : ${ROLES[p.role].e} ${ROLES[p.role].n}${p.role==='loup'&&wolves.length>1?` (avec ${wolves.filter(w=>w!==p).map(w=>w.name).join(', ')})`:''}`));
  sys(`🌕 Le village s'endort… ${wolves.length} loup${wolves.length>1?'s se cachent':' se cache'} parmi vous.`);
  lNight();
}
const isWolf=p=>p.role==='loup';
function lNight(){L.night={wolf:{},seer:null,witch:null,witchDone:false,save:false,poison:null};phase('night',75)}
function lWolfTarget(){const v=Object.values(L.night.wolf);if(!v.length)return null;const c={};v.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c));return pick(Object.keys(c).filter(k=>c[k]===m))}
function lNightReady(){
  const al=alive();const N=L.night;
  const wolvesDone=al.filter(isWolf).every(w=>N.wolf[w.id]);
  const seer=al.find(p=>p.role==='voyante');const witch=al.find(p=>p.role==='sorciere');
  return wolvesDone&&(!seer||N.seer)&&(!witch||N.witchDone);
}
function lNightAct(p,a){
  const N=L.night;if(G.phase.k!=='night'||p.out)return;
  const t=a.target?P(a.target):null;
  if(p.role==='loup'&&a.type==='wolf'&&t&&!t.out&&!isWolf(t)){N.wolf[p.id]=t.id;G.players.filter(w=>isWolf(w)&&!w.out&&w.id!==p.id).forEach(w=>tell(w,`🐺 ${p.name} veut dévorer ${t.name}.`))}
  if(p.role==='voyante'&&a.type==='seer'&&t&&!t.out&&t.id!==p.id&&!N.seer){N.seer=t.id;L.seen[p.id][t.id]=t.role;tell(p,`🔮 ${t.name} est ${ROLES[t.role].e} ${ROLES[t.role].n}.`)}
  if(p.role==='sorciere'&&a.type==='witch'&&!N.witchDone){
    const wolvesDone=alive().filter(isWolf).every(w=>N.wolf[w.id]);if(!wolvesDone)return;
    if(a.save&&L.potions.vie){N.save=true;L.potions.vie=false}
    if(a.poison&&L.potions.mort){const q=P(a.poison);if(q&&!q.out){N.poison=q.id;L.potions.mort=false}}
    N.witchDone=true;
  }
  if(lNightReady())lDawn();
}
function lDawn(){
  const N=L.night;const deaths=[];const v=lWolfTarget();
  if(v&&!N.save)deaths.push(v);
  if(N.poison&&!deaths.includes(N.poison))deaths.push(N.poison);
  L.lastDeaths=deaths;
  deaths.forEach(id=>lKill(P(id)));
  sys(deaths.length?`☀️ Le jour se lève. ${deaths.map(id=>{const p=P(id);return `${nm(p)} est mort (${ROLES[p.role].e} ${ROLES[p.role].n})`}).join(' · ')}.`:'☀️ Le jour se lève… et personne n’est mort cette nuit !');
  log(deaths.length?`Nuit ${L.round} : ${deaths.map(id=>P(id).name).join(', ')} mort(s).`:`Nuit ${L.round} : aucun mort.`);
  if(lWin())return;
  const hunter=deaths.map(P).find(p=>p.role==='chasseur');
  if(hunter)return phase('hunter',30,{actor:hunter.id,then:'day'});
  lDay();
}
function lKill(p){p.out=true;L.dead[p.id]=p.role}
function lDay(){L.votes={};L.claims=L.claims.filter(c=>c.round===L.round);phase('day',240,{})}
function lWin(){
  const al=alive();const w=al.filter(isWolf).length,o=al.length-w;
  if(w===0){endGame(G.players.filter(p=>!isWolf(p)).map(p=>p.id),'Le village a éliminé tous les loups !');return true}
  if(w>=o){endGame(G.players.filter(isWolf).map(p=>p.id),'Les loups-garous ont dévoré le village !');return true}
  return false;
}
function lVote(p,t){if(G.phase.k!=='day'||p.out)return;if(t!=='none'&&(!P(t)||P(t).out||t===p.id))return;L.votes[p.id]=t;
  if(alive().every(q=>L.votes[q.id]!=null||(!q.bot&&!q.online)))lVerdict()}
function lVerdict(){
  const c={};Object.values(L.votes).forEach(t=>{if(t!=='none')c[t]=(c[t]||0)+1});
  const m=Math.max(0,...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===m);
  const out=m>0&&top.length===1?P(top[0]):null;
  L.lastVote={votes:{...L.votes},out:out?out.id:null};
  if(out){lKill(out);sys(`⚖️ Le village élimine ${nm(out)} : c'était ${ROLES[out.role].e} ${ROLES[out.role].n} !`);log(`Jour ${L.round} : ${out.name} éliminé (${ROLES[out.role].n}).`)}
  else{sys('⚖️ Égalité : personne n’est éliminé aujourd’hui.')}
  if(lWin())return;
  phase('verdict',20,{});
}
function lAfterVerdict(){
  const out=L.lastVote&&L.lastVote.out?P(L.lastVote.out):null;
  if(out&&out.role==='chasseur'&&!L.hunted)return phase('hunter',30,{actor:out.id,then:'night'});
  L.round++;lNight();
}
function lHunt(p,t){
  const q=P(t);if(G.phase.k!=='hunter'||G.phase.actor!==p.id||!q||q.out)return;
  const then=G.phase.then;lKill(q);sys(`🏹 Le chasseur ${nm(p)} emporte ${nm(q)} : c'était ${ROLES[q.role].e} ${ROLES[q.role].n} !`);
  if(lWin())return;
  if(then==='day')lDay();else{L.round++;lNight()}
}
function lClaim(p,a){
  if(G.phase.k!=='day'||p.out)return;const t=P(a.target);if(!t||t.out||t.id===p.id)return;
  if(a.kind==='voyante'){const r=a.role==='loup'?'loup':'innocent';L.claims.push({by:p.id,t:t.id,kind:'voyante',r,round:L.round});say(p.id,'all',`🔮 Je suis la Voyante : ${t.name} est ${r==='loup'?'un LOUP-GAROU 🐺':'innocent 😇'} !`)}
  else{L.claims.push({by:p.id,t:t.id,kind:'accuse',round:L.round});say(p.id,'all',`👉 J'accuse ${t.name} !`)}
}
/* --- Robots du Loup-garou --- */
const BOT_DAY={innocent:['Je suis simple villageois, je vous jure 🙏','Quelqu’un a vu quelque chose cette nuit ?','{x} est bien calme aujourd’hui…','On ne vote pas au hasard, hein !','Moi je me méfie de {x}.'],loup:['Je suis villageois, pas de panique.','{x} me paraît suspect, franchement.','Pourquoi {x} accuse tout le monde ?','Votons {x}, on n’a rien de mieux.']};
function botLoup(b){
  const ph=G.phase;const el=Date.now()-ph.start;if(b.out)return false;
  const others=alive().filter(x=>x.id!==b.id);
  const fill=t=>t.replace('{x}',()=>pick(others).name);
  if(ph.k==='night'&&el>1500+rnd(3000)){
    const N=L.night;
    if(isWolf(b)&&!N.wolf[b.id]){
      const mate=Object.values(N.wolf)[0];
      const seerClaim=L.claims.filter(c=>c.kind==='voyante').map(c=>P(c.by)).find(p=>p&&!p.out&&!isWolf(p));
      const prey=mate?P(mate):seerClaim||pick(others.filter(x=>!isWolf(x)));
      if(prey){lNightAct(b,{type:'wolf',target:prey.id});return true}
    }
    if(b.role==='voyante'&&!N.seer){const unk=others.filter(x=>!L.seen[b.id][x.id]);if(unk.length){lNightAct(b,{type:'seer',target:pick(unk).id});return true}else{N.seer='none';if(lNightReady())lDawn();return true}}
    if(b.role==='sorciere'&&!N.witchDone&&alive().filter(isWolf).every(w=>N.wolf[w.id])){
      const v=lWolfTarget();const sus=topSuspect(b);
      lNightAct(b,{type:'witch',save:v&&L.potions.vie&&(v===b.id||chance(.55)),poison:L.potions.mort&&sus&&chance(.2)?sus:null});return true}
  }
  if(ph.k==='day'){
    if(b.talked!==L.round&&el>2500+rnd(9000)){
      b.talked=L.round;
      if(b.role==='voyante'){const found=Object.entries(L.seen[b.id]).find(([id,r])=>r==='loup'&&!P(id).out);if(found&&chance(.8)){lClaim(b,{kind:'voyante',target:found[0],role:'loup'});return true}}
      if(isWolf(b)){
        const accuser=L.claims.find(c=>c.kind==='voyante'&&P(c.t)&&isWolf(P(c.t))&&c.round===L.round);
        if(accuser&&chance(.5)){const t=P(accuser.by);if(t&&!t.out){lClaim(b,{kind:'voyante',target:t.id,role:'loup'});return true}}
        if(chance(.5)){lClaim(b,{kind:'accuse',target:pick(others.filter(x=>!isWolf(x))).id});return true}
        say(b.id,'all',fill(pick(BOT_DAY.loup)));return true;
      }
      if(chance(.4)){const s=topSuspect(b);if(s){lClaim(b,{kind:'accuse',target:s});return true}}
      say(b.id,'all',fill(pick(BOT_DAY.innocent)));return true;
    }
    if(L.votes[b.id]==null){
      const human=G.players.find(p=>!p.bot&&!p.out&&p.online);
      const ready=G.solo?(human?L.votes[human.id]!=null||el>90000:el>20000):el>25000+rnd(20000);
      if(ready&&el>8000){
        let t;
        if(isWolf(b)){const accused=L.claims.filter(c=>!isWolf(P(c.t))&&!P(c.t).out).map(c=>c.t);t=accused.length&&chance(.7)?pick(accused):pick(others.filter(x=>!isWolf(x))).id}
        else if(b.role==='voyante'){const f=Object.entries(L.seen[b.id]).find(([id,r])=>r==='loup'&&!P(id).out);t=f?f[0]:topSuspect(b)}
        else t=topSuspect(b);
        lVote(b,t||pick(others).id);return true;
      }
    }
  }
  if(ph.k==='hunter'&&ph.actor===b.id&&el>1500){const s=topSuspect(b)||pick(alive()).id;lHunt(b,s);return true}
  return false;
}
function topSuspect(b){
  const sc={};alive().forEach(p=>{if(p.id!==b.id)sc[p.id]=Math.random()*.5});
  L.claims.forEach(c=>{if(sc[c.t]==null)return;
    if(c.kind==='voyante'){const nClaims=L.claims.filter(x=>x.kind==='voyante'&&x.round===c.round).length;const w=nClaims>1?1:2.5;sc[c.t]+=c.r==='loup'?w:-w}
    else sc[c.t]+=c.by===b.id?0:.8;});
  Object.entries(L.votes).forEach(([v,t])=>{if(sc[t]!=null&&P(v)&&!P(v).bot)sc[t]+=.6});
  if(b.role==='voyante')Object.entries(L.seen[b.id]).forEach(([id,r])=>{if(sc[id]!=null)sc[id]+=r==='loup'?10:-10});
  const best=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];return best||null;
}
function loupAuto(){
  const ph=G.phase;
  if(ph.k==='night'){const N=L.night;alive().filter(isWolf).forEach(w=>{if(!N.wolf[w.id]){const t=pick(alive().filter(x=>!isWolf(x)));if(t)N.wolf[w.id]=t.id}});if(!N.seer)N.seer='none';N.witchDone=true;lDawn()}
  else if(ph.k==='day')lVerdict();
  else if(ph.k==='verdict')lAfterVerdict();
  else if(ph.k==='hunter'){const t=pick(alive().filter(x=>x.id!==ph.actor));if(t)lHunt(P(ph.actor),t.id);else{if(!lWin())lDay()}}
}

function handleAct(pid,a){
  if(!G)return;const p=P(pid);if(!p)return;const err=m=>tell(p,'⚠️ '+m);
  if(a.type==='msg'){const txt=String(a.txt||'').trim().slice(0,160);if(!txt)return sync();
    if(Date.now()-(p.lastMsg||0)<1000)return sync();p.lastMsg=Date.now();
    let to='all';if(a.to==='wolves'&&G.game==='loup'&&G.status==='play'&&p.role==='loup')to='wolves';else if(P(a.to)&&a.to!==pid)to=a.to;
    if(G.game==='loup'&&G.status==='play'&&p.out)return err('Les morts ne parlent pas… (sauf à voix basse 👻)'),sync();
    say(pid,to,txt);return sync()}
  if(G.status==='lobby'){
    if(pid!==hostPid)return;
    if(a.type==='settings'){if(['facile','normal'].includes(a.mode))G.mode=a.mode;if(['bluff','loup'].includes(a.game))G.game=a.game}
    if(a.type==='kick'&&a.id!==hostPid){G.players=G.players.filter(x=>x.id!==a.id);for(const [cid,id] of Object.entries(connPid))if(id===a.id){net.send(cid,{t:'err',msg:'L’hôte t’a retiré du salon.'});delete connPid[cid]}}
    if(a.type==='bot'&&G.players.length<8){const used=G.players.map(x=>x.name);const b=BOTS.find(([n])=>!used.includes(n));if(b)addPlayer('bot-'+uid(),b[0],b[1],true)}
    if(a.type==='start'){const min=G.game==='loup'?5:2;if(G.players.length<min)err(`Il faut au moins ${min} joueurs (ajoute des robots).`);else startGame()}
    return sync();
  }
  if(G.status==='end'){if(a.type==='again'&&pid===hostPid){if(a.game&&['bluff','loup'].includes(a.game))G.game=a.game;G.id=uid();if(G.game==='loup'&&G.players.length<5)while(G.players.length<5){const used=G.players.map(x=>x.name);const b=BOTS.find(([n])=>!used.includes(n));addPlayer('bot-'+uid(),b[0],b[1],true)}startGame()}return sync()}
  const ph=G.phase;
  if(G.game==='bluff'){
    if(a.type==='action'&&ph.k==='action'&&ph.actor===pid){const e=bAction(p,a);if(e)err(e)}
    else if(a.type==='respond')bRespond(p,{type:a.rtype,c:a.c});
    else if(a.type==='lose'&&ph.k==='lose'&&ph.actor===pid)bKill(p,+a.idx||0,ph.after,ph.why);
    else if(a.type==='exchange'&&ph.k==='exchange'&&ph.actor===pid)bExchange(p,a.keep||[]);
  }else{
    if(['wolf','seer','witch'].includes(a.type))lNightAct(p,a);
    else if(a.type==='vote')lVote(p,a.target);
    else if(a.type==='claim')lClaim(p,a);
    else if(a.type==='hunt')lHunt(p,a.target);
    else if(a.type==='next'&&pid===hostPid&&ph.k==='verdict')lAfterVerdict();
    else if(a.type==='endday'&&pid===hostPid&&ph.k==='day')lVerdict();
  }
  sync();
}
function tick(){
  if(!G||G.status!=='play'||!G.phase)return false;
  let acted=false;
  for(const b of G.players.filter(x=>x.bot)){if(G.status!=='play')break;if(G.game==='bluff'?botBluff(b):botLoup(b)){acted=true;break}}
  if(G.status==='play'&&G.phase.deadline&&Date.now()>G.phase.deadline){if(G.game==='bluff')bluffAuto();else loupAuto();acted=true}
  return acted;
}
function viewFor(pid){
  const me=P(pid);const ph=G.phase?{...G.phase}:null;
  if(ph){ph.left=ph.deadline?Math.max(0,ph.deadline-Date.now()):null;delete ph.deadline;if(ph.k==='exchange'&&ph.actor!==pid)delete ph.opts}
  const v={gid:G.id,code:G.code,status:G.status,game:G.game,mode:G.mode,solo:G.solo,host:hostPid,log:G.log.slice(0,12),phase:ph,end:G.end,
    msgs:G.msgs.filter(m=>m.to==='all'||m.to===pid||m.from===pid||(m.to==='wolves'&&me&&me.role==='loup'&&G.status==='play')||(G.status==='end'&&m.to==='wolves')).slice(-40),
    players:G.players.map(p=>({id:p.id,name:p.name,av:p.av,bot:p.bot,online:p.online,out:!!p.out,wins:p.wins})),inbox:me?me.inbox:[]};
  if(G.status==='lobby')return v;
  if(G.game==='bluff'&&G.B){
    v.B={turn:G.B.turn,deck:G.B.deck.length,copies:G.B.copies,claims:G.B.claims,reveal:G.B.reveal||null,
      seats:G.players.map(p=>({id:p.id,coins:p.coins,cards:p.cards.map(c=>({dead:c.dead,c:c.dead||p.id===pid||G.status==='end'?c.c:null}))}))};
  }
  if(G.game==='loup'&&G.L){
    const Lx=G.L;const wolfMe=me&&me.role==='loup';
    v.L={round:Lx.round,dead:Lx.dead,claims:Lx.claims,votes:ph&&ph.k==='day'?Lx.votes:{},lastVote:Lx.lastVote||null,lastDeaths:Lx.lastDeaths||[],
      me:me?{role:me.role,wolves:wolfMe?G.players.filter(isWolf).map(p=>p.id):null,seen:me.role==='voyante'?Lx.seen[me.id]:null,potions:me.role==='sorciere'?Lx.potions:null}:null,
      roles:G.status==='end'?Object.fromEntries(G.players.map(p=>[p.id,p.role])):null,night:null};
    if(ph&&ph.k==='night'&&me&&!me.out){const N=Lx.night;
      v.L.night={wolf:wolfMe?N.wolf:null,mine:me.role==='loup'?N.wolf[me.id]||null:me.role==='voyante'?N.seer:me.role==='sorciere'?(N.witchDone?'done':null):null,
        victim:me.role==='sorciere'&&alive().filter(isWolf).every(w=>N.wolf[w.id])?lWolfTarget():undefined}}
  }
  return v;
}

const LOCAL=new URLSearchParams(location.search).has('local');
const PREFIX='coupsbas-y1-';
function makeHostNet(code,h){
  if(LOCAL){const bc=new BroadcastChannel(PREFIX+code);bc.onmessage=e=>{const m=e.data;if(m.to==='host'&&m.kind==='data')h.onData(m.from,m.d)};setTimeout(()=>h.onOpen(),0);return {send:(id,d)=>bc.postMessage({to:id,kind:'data',d})}}
  if(typeof Peer==='undefined'){h.onError('nopeer');return null}
  const conns={};let peer;
  const boot=()=>{peer=new Peer(PREFIX+code,{debug:0});peer.on('open',()=>h.onOpen());
    peer.on('connection',c=>{const id=c.connectionId;c.on('open',()=>{conns[id]=c});c.on('data',d=>h.onData(id,d));c.on('close',()=>{delete conns[id];h.onClose(id)});c.on('error',()=>{})});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('error',e=>{if(e.type==='unavailable-id')h.onError('taken');else if(['network','server-error','socket-error'].includes(e.type))h.onError('network')})};
  boot();
  return {send:(id,d)=>{const c=conns[id];if(c&&c.open)try{c.send(d)}catch(e){}},retry:()=>{try{peer.destroy()}catch(e){}setTimeout(boot,1500)}};
}
function makeClientNet(code,h){
  if(LOCAL){const me='c'+uid();const bc=new BroadcastChannel(PREFIX+code);bc.onmessage=e=>{const m=e.data;if(m.to===me&&m.kind==='data')h.onData(m.d)};setTimeout(()=>h.onOpen(),50);return {send:d=>bc.postMessage({to:'host',from:me,kind:'data',d})}}
  if(typeof Peer==='undefined'){h.onError('nopeer');return null}
  let peer,conn,timer=null;
  const connect=()=>{clearTimeout(timer);conn=peer.connect(PREFIX+code,{reliable:true});conn.on('open',()=>h.onOpen());conn.on('data',d=>h.onData(d));conn.on('close',()=>{h.onClose();timer=setTimeout(connect,2000)});conn.on('error',()=>{})};
  peer=new Peer({debug:0});peer.on('open',connect);
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{if(e.type==='peer-unavailable'){h.onError('notfound');clearTimeout(timer);timer=setTimeout(connect,3000)}else if(['network','server-error'].includes(e.type))h.onError('network')});
  return {send:d=>{if(conn&&conn.open)try{conn.send(d)}catch(e){}}};
}
let net=null,isHost=false,hostPid=null,myPid=null,V=null;
const connPid={};
function restore(game){G=game;B=G.B||null;L=G.L||null}
function hostLoop(){
  setInterval(()=>{
    if(!G)return;const now=Date.now();let ch=false;
    G.players.forEach(p=>{if(p.bot||p.id===hostPid){p.online=true;return}const on=Object.values(connPid).includes(p.id)&&now-p.last<20000;if(on!==p.online){p.online=on;ch=true}});
    const s=G.seq;const acted=tick();
    if(acted||ch||G.seq!==s||G.status==='play')sync();
  },700);
}
function hostStart(code,game){
  isHost=true;restore(game);hostPid=myPid;
  net=makeHostNet(code,{
    onOpen(){status('');sync()},
    onData(id,m){
      if(!m||typeof m!=='object')return;
      if(m.t==='hello'){let p=P(m.pid);
        if(!p){if(G.status!=='lobby')return net.send(id,{t:'err',msg:'La partie a déjà commencé. Attends la prochaine !'});
          if(G.players.length>=8)return net.send(id,{t:'err',msg:'Salon complet (8 joueurs).'});
          p=addPlayer(String(m.pid).slice(0,20),m.name,AVATARS.includes(m.av)?m.av:AVATARS[0],false)}
        connPid[id]=p.id;p.online=true;p.last=Date.now();sync()}
      else if(m.t==='ping'){const p=P(connPid[id]);if(p){p.last=Date.now()}}
      else if(m.t==='act'){const pid=connPid[id];if(pid){const p=P(pid);if(p)p.last=Date.now();handleAct(pid,m.a||{})}}
    },
    onClose(id){const p=P(connPid[id]);delete connPid[id];if(p){p.online=Object.values(connPid).includes(p.id);sync()}},
    onError(t){if(t==='taken'){status('Le code est encore réservé… nouvelle tentative.');setTimeout(()=>net&&net.retry&&net.retry(),2500)}else if(t==='nopeer')status('Impossible de charger le module réseau. Vérifie ta connexion internet puis recharge.',true);else status('Connexion au serveur de jeu perdue… reconnexion.',true)}
  });
  hostLoop();status('Ouverture du salon…');sync();
}
function soloStart(game){isHost=true;restore(game);hostPid=myPid;G.solo=true;hostLoop();sync()}
function sync(){
  if(!G)return;
  for(const [cid,pid] of Object.entries(connPid))net&&net.send(cid,{t:'view',v:viewFor(pid)});
  store.set('coupsbas-y-host',{G,hostPid});
  receive(viewFor(hostPid));
}
function clientStart(code,name,av){
  isHost=false;
  net=makeClientNet(code,{
    onOpen(){status('');net.send({t:'hello',pid:myPid,name,av})},
    onData(m){if(m.t==='view')receive(m.v);else if(m.t==='err')status(m.msg,true)},
    onClose(){status('Connexion perdue… reconnexion.',true)},
    onError(t){if(t==='notfound')status(`Salon ${code} introuvable. Vérifie le code : l’hôte doit garder la page ouverte.`,true);else if(t==='nopeer')status('Impossible de charger le module réseau. Vérifie ta connexion internet puis recharge.',true);else status('Problème de connexion… nouvelle tentative.',true)}
  });
  setInterval(()=>net&&net.send({t:'ping'}),5000);
}
function send(a){if(isHost)handleAct(myPid,a);else net&&net.send({t:'act',a})}

const pp=(v,id)=>v.players.find(p=>p.id===id);

      <div class="info">${s.cards.map(c=>`<span class="mini ${c.dead?'dead':''}" title="${c.c?CHARS[c.c].n:'carte cachée'}">${c.c&&(c.dead||p.id===myPid)?CHARS[c.c].e:'?'}</span>`).join('')}<span class="coins">${s.coins} 🪙</span></div>
      <div class="claims">${cl.length?'prétend : '+cl.map(c=>CHARS[c].e).join(' '):'&nbsp;'}</div></div>`}).join('')}</div>`;

  if(v.game==='bluff'&&v.B)extra=`<div class="plist">${v.players.map(p=>{const s=v.B.seats.find(x=>x.id===p.id);return `<div class="pl"><span class="av">${p.av}</span><span class="nm">${esc(p.name)}</span><span>${s.cards.map(c=>CHARS[c.c].e).join(' ')}</span>${E.winners.includes(p.id)?'🏆':''}</div>`}).join('')}</div>`;
  app.innerHTML=`<div class="top"><span class="brand">Coups Bas !</span></div>
  <section class="card" style="text-align:center"><h2 style="font-size:1.9rem">${won?'🏆 Victoire !':'💀 Perdu…'}</h2><p class="big">${esc(E.txt)}</p>${extra}
    <p class="small" style="margin-top:10px">Victoires : ${v.players.filter(p=>p.wins).map(p=>`${p.av} ${esc(p.name)} ×${p.wins}`).join(' · ')||'—'}</p>
    ${myPid===v.host?`<div class="acts"><button class="btn big" data-act="again" data-g="${v.game}">Rejouer ${GAMEINFO[v.game].e} ${GAMEINFO[v.game].n}</button><button class="btn alt" data-act="again" data-g="${v.game==='bluff'?'loup':'bluff'}">Passer à ${GAMEINFO[v.game==='bluff'?'loup':'bluff'].e} ${GAMEINFO[v.game==='bluff'?'loup':'bluff'].n}</button></div>`:'<p class="small">L’hôte peut relancer une partie.</p>'}
  </section>${chatHtml(v)}`;
  document.body.classList.remove('day');
}
function updTimer(){const t=$('#tbar');if(t)t.style.width=Math.max(0,Math.min(100,(ui.deadline-Date.now())/ui.total/10))+'%'}
setInterval(updTimer,500);
function render(){
  const v=V;if(!v)return;
  const keep={};['msgIn','msgTo'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});
  const fid=document.activeElement&&document.activeElement.id;const mEl=$('#msgs');const atBottom=!mEl||mEl.scrollHeight-mEl.scrollTop-mEl.clientHeight<40;
  const det=[...document.querySelectorAll('details')].map(d=>d.open);
  if(v.status==='lobby')renderLobby(v);else if(v.status==='end')renderEnd(v);else renderGame(v);
  Object.entries(keep).forEach(([id,val])=>{const el=document.getElementById(id);if(el&&(el.tagName!=='SELECT'||[...el.options].some(o=>o.value===val)))el.value=val});
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true})}}
  const m2=$('#msgs');if(m2&&atBottom)m2.scrollTop=m2.scrollHeight;
  document.querySelectorAll('details').forEach((d,i)=>{if(det[i])d.open=true});
  updTimer();if(v.status!=='lobby')bindGame();
}
function receive(v){
  const prev=V;V=v;
  if(v.phase&&v.phase.left!=null){ui.deadline=Date.now()+v.phase.left;ui.total=v.phase.total||20}
  v.inbox.forEach(m=>{if(m.i>ui.lastInbox)toast(m.t)});ui.lastInbox=Math.max(ui.lastInbox,0,...v.inbox.map(m=>m.i));
  const top=Math.max(0,...v.msgs.map(m=>m.i));if(ui.lastMsg!=null)v.msgs.filter(m=>m.i>ui.lastMsg&&m.from&&m.from!==myPid&&m.to!=='all').forEach(m=>{toast(`${m.to==='wolves'?'🐺':'🔒'} ${(pp(v,m.from)||{}).name||''} : ${m.txt}`);buzz(60)});ui.lastMsg=top;
  if(prev&&v.phase&&prev.phase){
    const pk=prev.phase.k,k=v.phase.k;
    if(v.game==='bluff'&&k==='action'&&v.phase.actor===myPid&&!(pk==='action'&&prev.phase.actor===myPid)){banner('À toi !');buzz(150)}
    if(v.game==='bluff'&&k==='respond'&&v.phase.elig.includes(myPid)&&(pk!=='respond'||prev.phase.stage!==v.phase.stage)&&v.phase.target===myPid)buzz([100,60,100]);
    if(v.game==='bluff'&&v.B&&v.B.reveal&&JSON.stringify(v.B.reveal)!==JSON.stringify(prev.B&&prev.B.reveal))banner(v.B.reveal.ok?'✅ Il disait vrai !':'🤥 Menteur démasqué !');
    if(v.game==='loup'&&k!==pk){if(k==='night')banner('🌙 La nuit tombe…');if(k==='day')banner('☀️ Le village se réveille');if(k==='verdict')banner('⚖️ Verdict');}
  }
  if(v.status==='end'&&prev&&prev.status!=='end')banner(v.end.winners.includes(myPid)?'🏆 Victoire !':'Fin de partie');
  if(!prev||!v.phase||!prev.phase||prev.phase.k!==v.phase.k||prev.phase.actor!==v.phase.actor)ui.sel={};
  const sig=JSON.stringify({...v,phase:v.phase&&{...v.phase,left:0}});
  if(sig===ui.sig)return;ui.sig=sig;
  const y=window.scrollY;render();window.scrollTo(0,y);
}
function bindGame(){
  app.onclick=e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
    switch(d.act){
      case 'pickact':ui.sel.act=ui.sel.act===d.k?null:d.k;render();break;
      case 'doact':send({type:'action',act:ui.sel.act,target:d.t});ui.sel={};break;
      case 'resp':send({type:'respond',rtype:d.r,c:d.c});break;
      case 'lose':send({type:'lose',idx:+d.i});break;
      case 'keep':{const i=+d.i;const k=ui.sel.keep||[];ui.sel.keep=k.includes(i)?k.filter(x=>x!==i):[...k,i].slice(-V.phase.keep);render();break}
      case 'doexch':send({type:'exchange',keep:ui.sel.keep});ui.sel={};break;
      case 'wolf':send({type:'wolf',target:d.t});break;
      case 'seer':send({type:'seer',target:d.t});break;
      case 'wsave':ui.sel.save=!ui.sel.save;render();break;
      case 'wpoison':ui.sel.poison=ui.sel.poison===d.t?null:d.t;render();break;
      case 'witch':send({type:'witch',save:!!ui.sel.save,poison:ui.sel.poison||null});ui.sel={};break;
      case 'vote':send({type:'vote',target:d.t});break;
      case 'accuse':send({type:'claim',kind:'accuse',target:d.t});break;
      case 'seerclaim':send({type:'claim',kind:'voyante',target:d.t,role:d.r});break;
      case 'hunt':send({type:'hunt',target:d.t});break;
      case 'next':send({type:'next'});break;
      case 'endday':send({type:'endday'});break;
      case 'quick':send({type:'msg',to:$('#msgTo')?$('#msgTo').value:'all',txt:d.q});break;
      case 'again':send({type:'again',game:d.g});break;
    }
  };
  app.onsubmit=e=>{e.preventDefault();if(e.target.id==='msgForm'){const i=$('#msgIn');const t=i.value.trim();if(t){send({type:'msg',to:$('#msgTo').value,txt:t});i.value=''}}};
}
(function boot(){
  const s=sstore.get('coupsbas-y-session',null);myPid=sstore.get('coupsbas-y-pid',null);
  if(s&&myPid){
    if(s.host){const saved=store.get('coupsbas-y-host',null);if(saved&&saved.G&&saved.G.code===s.code&&saved.hostPid===myPid){if(saved.G.solo)soloStart(saved.G);else hostStart(s.code,saved.G);return}}
    else{app.innerHTML=`<div class="hero"><h1 class="logo">Coups Bas !</h1><p class="tag">Reconnexion au salon <b>${esc(s.code)}</b>…</p>${statusEl()}<button class="btn alt" id="leave">Quitter</button></div>`;
      $('#leave').onclick=()=>{try{sessionStorage.clear()}catch(e){}location.href=location.pathname+(LOCAL?'?local=1':'')};clientStart(s.code,s.name,s.av);return}
  }
  renderHome();
})();
</script>
